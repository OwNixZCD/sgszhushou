<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国杀十周年 · 张裕 · 相谶</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #15192a;
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 30px 16px 60px;
    color: #e8e0d0;
  }

  .container {
    max-width: 1100px;
    width: 100%;
    background: #1f2436;
    border-radius: 24px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,215,150,0.12);
    padding: 30px 28px 36px;
    border: 1px solid #353a4e;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
    border-bottom: 2px solid #353a4e;
    padding-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header h1 {
    font-size: 27px;
    letter-spacing: 6px;
    color: #f0d89c;
    font-weight: 600;
    text-shadow: 0 0 24px rgba(240,216,156,0.18);
  }
  .header h1 small {
    font-size: 14px;
    letter-spacing: 2px;
    color: #7a8099;
    margin-left: 12px;
    font-weight: 400;
  }
  .header .meta {
    font-size: 14px;
    color: #8a8fa3;
    letter-spacing: 1px;
  }
  .header .meta span { color: #f0d89c; font-weight: 600; }

  .desc-box {
    background: #181c2a;
    border-left: 4px solid #c9a85c;
    padding: 14px 18px;
    border-radius: 8px;
    margin-bottom: 22px;
    font-size: 14px;
    line-height: 1.8;
    color: #b8bccc;
    letter-spacing: 0.4px;
  }
  .desc-box strong { color: #f0d89c; }
  .desc-box .sub {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    color: #7a8099;
  }
  .desc-box .sub span { color: #f0d89c; font-weight: 600; }

  .selection-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .selection-row .label {
    font-size: 15px;
    color: #9a9fb4;
    letter-spacing: 2px;
    min-width: 44px;
    font-weight: 600;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .toggle-btn {
    background: #252a3d;
    border: 1px solid #414a63;
    color: #9a9fb4;
    padding: 9px 22px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    transition: all 0.2s;
    font-weight: 600;
  }
  .toggle-btn:hover {
    border-color: #8a8fa3;
    color: #d0d4e0;
    background: #2d3348;
  }
  .toggle-btn.active {
    background: linear-gradient(145deg, #4a5068, #353a50);
    border-color: #c9a85c;
    color: #f0d89c;
    box-shadow: 0 0 16px rgba(201,168,92,0.18), inset 0 1px 0 rgba(255,215,150,0.1);
  }

  .action-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 22px 0 18px;
  }

  .btn {
    background: linear-gradient(145deg, #3a4058, #2a2f42);
    color: #f0d89c;
    border: 1px solid #5a5f78;
    border-radius: 10px;
    padding: 11px 30px;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .btn:hover:not(:disabled) {
    background: linear-gradient(145deg, #4a5068, #353a50);
    border-color: #c9a85c;
    box-shadow: 0 6px 22px rgba(201,168,92,0.15);
    transform: translateY(-1px);
  }
  .btn:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    filter: grayscale(0.6);
  }
  .btn.secondary {
    background: transparent;
    border: 1px solid #4a5068;
    color: #8a8fa3;
    padding: 11px 24px;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .btn.secondary:hover:not(:disabled) {
    border-color: #8a8fa3;
    color: #d0d4e0;
    background: rgba(255,255,255,0.03);
  }
  .btn.gold {
    background: linear-gradient(145deg, #6b5a2e, #4a3d1e);
    border-color: #c9a85c;
    color: #f5e6b8;
  }
  .btn.gold:hover:not(:disabled) {
    background: linear-gradient(145deg, #7d6a38, #5a4a24);
    box-shadow: 0 6px 24px rgba(201,168,92,0.28);
  }

  .result-area {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 6px;
  }
  .result-area.hidden {
    display: none !important;
  }

  .card-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .skill-card {
    flex: 1 1 220px;
    background: linear-gradient(160deg, #2a3048, #1d2234);
    border: 1px solid #3d4358;
    border-radius: 14px;
    padding: 14px 16px 16px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  .skill-card.static { cursor: default; }
  .skill-card:not(.static):hover {
    border-color: #c9a85c;
    box-shadow: 0 8px 26px rgba(201,168,92,0.14);
    transform: translateY(-3px);
  }
  .skill-card.selected {
    border-color: #f0d89c;
    background: linear-gradient(160deg, #323a56, #262c42);
    box-shadow: 0 0 0 2px rgba(240,216,156,0.35), 0 8px 26px rgba(201,168,92,0.2);
  }
  .skill-card .badge {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 11px;
    color: #6a7090;
    letter-spacing: 1px;
    background: #15192a;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid #31364a;
  }
  .skill-card.selected .badge {
    color: #f0d89c;
    border-color: #c9a85c;
  }
  .skill-card .skill-name {
    font-size: 18px;
    font-weight: 700;
    color: #f0d89c;
    letter-spacing: 3px;
    margin-bottom: 5px;
  }
  .skill-card .skill-source {
    font-size: 11px;
    color: #7a8099;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .skill-card .skill-desc {
    font-size: 12px;
    line-height: 1.6;
    color: #b8bccc;
    letter-spacing: 0.3px;
  }

  .section { margin-top: 26px; }
  .section-title {
    font-size: 15px;
    color: #c9a85c;
    letter-spacing: 3px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2d3348;
    font-weight: 600;
  }

  .current-skills {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-list .tag {
    background: #252a3d;
    border: 1px solid #3d4358;
    color: #c9a85c;
    padding: 5px 14px;
    border-radius: 24px;
    font-size: 13px;
    letter-spacing: 1px;
    transition: border 0.2s;
  }
  .history-list .tag:hover { border-color: #c9a85c; }
  .history-list .empty {
    color: #4e5470;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 8px 0;
  }
  .empty-hint {
    text-align: center;
    padding: 32px 20px;
    color: #4e5470;
    font-size: 15px;
    letter-spacing: 2px;
  }

  .mingding-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 22, 0.98);
    display: none;
    justify-content: center;
    align-items: flex-start;
    z-index: 1000;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .mingding-overlay.show { display: flex; }

  .mingding-content {
    max-width: 950px;
    width: 100%;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .mingding-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .mingding-header .title {
    font-size: 30px;
    letter-spacing: 8px;
    color: #f0d89c;
    font-weight: 700;
    text-shadow: 0 0 30px rgba(240,216,156,0.25);
    margin-bottom: 10px;
  }
  .mingding-header .subtitle {
    font-size: 14px;
    color: #7a8099;
    letter-spacing: 3px;
  }

  .mingding-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .mingding-cards .skill-card {
    flex: 1 1 240px;
    max-width: 280px;
    cursor: default;
    border-color: #4a5068;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .mingding-cards .skill-card:hover {
    transform: none;
    border-color: #c9a85c;
    box-shadow: 0 8px 30px rgba(201,168,92,0.12);
  }

  .mingding-confirm {
    text-align: center;
    padding: 50px 20px;
  }
  .mingding-confirm .confirm-text {
    color: #c9a85c;
    font-size: 20px;
    letter-spacing: 4px;
    margin-bottom: 40px;
    font-weight: 600;
  }
  .mingding-confirm .confirm-btns {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .mingding-confirm .btn {
    font-size: 18px;
    padding: 14px 50px;
    letter-spacing: 6px;
  }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #252a3d;
    border: 1px solid #c9a85c;
    color: #f0d89c;
    padding: 14px 34px;
    border-radius: 12px;
    font-size: 15px;
    letter-spacing: 2px;
    box-shadow: 0 12px 44px rgba(0,0,0,0.75);
    opacity: 0;
    transition: opacity 0.35s, transform 0.35s;
    pointer-events: none;
    z-index: 2000;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 640px) {
    .container { padding: 18px 14px 28px; }
    .header h1 { font-size: 21px; letter-spacing: 4px; }
    .header h1 small { font-size: 12px; margin-left: 6px; }
    .skill-card { flex: 1 1 100%; }
    .action-row { flex-direction: column; }
    .btn { width: 100%; text-align: center; }
    .toggle-btn { padding: 8px 14px; font-size: 14px; }
    .mingding-header .title { font-size: 22px; letter-spacing: 5px; }
    .mingding-cards .skill-card { max-width: 100%; }
    .mingding-confirm .confirm-btns { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>张裕<small>· 相谶</small></h1>
  </div>

  <div class="desc-box">
    <strong>〖相谶〗</strong>出牌阶段，你可以选择一名角色，然后从随机三个与其势力及初始体力值相同的武将技能中选择一个获得（限定技、觉醒技、主公技除外）。你的回合结束时失去以此法获得的技能。<br>
    <span class="sub">本回合已获得技能数：<span id="skillCount">0</span> / 3</span>
  </div>

  <div class="selection-row">
    <span class="label">势力</span>
    <div class="btn-group" id="factionGroup">
      <button class="toggle-btn active" data-value="蜀">蜀</button>
      <button class="toggle-btn" data-value="魏">魏</button>
      <button class="toggle-btn" data-value="吴">吴</button>
      <button class="toggle-btn" data-value="群">群</button>
    </div>
  </div>

  <div class="selection-row">
    <span class="label">体力</span>
    <div class="btn-group" id="hpGroup">
      <button class="toggle-btn active" data-value="3">3</button>
      <button class="toggle-btn" data-value="4">4</button>
      <button class="toggle-btn" data-value="5">5</button>
      <!-- <button class="toggle-btn" data-value="6">6</button> -->
    </div>
  </div>

  <div class="action-row">
    <button class="btn" id="btnDraw">发动 相谶</button>
    <button class="btn" id="btnEndTurn">回合结束</button>
    <button class="btn gold" id="btnMingding">发动 命定</button>
  </div>

  <div class="result-area hidden" id="resultArea"></div>

  <div class="section">
    <div class="section-title">本回合已获得技能</div>
    <div class="current-skills" id="currentSkillsArea">
      <div class="empty-hint">暂无</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">相谶 · 已记录技能</div>
    <div class="history-list" id="historyArea">
      <span class="empty">无</span>
    </div>
  </div>

</div>

<div class="mingding-overlay" id="mingdingOverlay">
  <div class="mingding-content">
    <div class="mingding-header" id="mingdingHeader">
      <div class="title">命定</div>
      <div class="subtitle">从曾经获得过的技能中，随机获得三个技能</div>
    </div>
    <div class="mingding-cards" id="mingdingCards"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SKILL_POOL = {
  '蜀': {
    3: [
      { name: '观星', source: '诸葛亮', desc: '准备阶段，你可以观看牌堆顶的五张牌（当存活角色数小于4时改为三张），将这些牌以任意顺序置于牌堆顶或牌堆底。若你将这些牌均置于牌堆底，你可以于结束阶段再次“观星”。' },
      { name: '空城', source: '诸葛亮', desc: '锁定技，若你没有手牌，你不能成为【杀】或【决斗】的目标。' },
      { name: '集智', source: '黄月英', desc: '当你使用一张非转化的锦囊牌时，你可以摸一张牌。若摸的牌为基本牌，你可以弃置此牌，令你本回合的手牌上限+1。' },
      { name: '奇才', source: '黄月英', desc: '	锁定技，你使用锦囊牌无距离限制。当其他角色弃置你装备区里的防具牌或宝物牌时，取消之。' },
      { name: '巧说', source: '简雍', desc: '出牌阶段，你可以与一名其他角色拼点，若你赢，则你本阶段使用下一张基本牌或普通锦囊牌时可以为此牌增加或减少一个目标，否则你结束出牌阶段且本回合锦囊牌不计入手牌上限。' },
      { name: '纵适', source: '简雍', desc: '当你拼点后，你可以获得两张拼点牌中点数较小的一张（若你没赢，则只获得你的拼点牌）。' },
      { name: '散谣', source: '马谡', desc: '出牌阶段限一次，你可以弃置任意张牌，对等量名除你以外全场体力值最大的角色各造成1点伤害。' },
      { name: '制蛮', source: '马谡', desc: '当你对其他角色造成伤害时，你可以防止此伤害，然后获得其区域里的一张牌。' },
      { name: '恩怨', source: '法正', desc: '当你一次性获得一名其他角色的至少两张牌后，你可以令其摸一张牌。当你受到1点伤害后，你可以令伤害来源选择一项：1.交给你一张手牌，然后若此牌的花色不为♥️，你摸一张牌；2.失去1点体力。' },
      { name: '眩惑', source: '法正', desc: '摸牌阶段结束时，你可以将两张手牌交给一名其他角色，并选择另一名其他角色，然后令该角色选择一项：1.视为对你选择的角色使用一张任意类型的【杀】或【决斗】；2.将所有手牌交给你。' },
      { name: '樵拾', source: '夏侯氏', desc: '其他角色的结束阶段，若其手牌数与你相等，你可以与其各摸一张牌，然后若这两张牌花色相同，你可以重复此流程。' },
      { name: '燕语', source: '夏侯氏', desc: '出牌阶段，你可以重铸一张【杀】。出牌阶段结束时，你可以令一名男性角色摸X张牌（X为你本阶段以此法重铸【杀】的数量且至多为3）。' },
      { name: '强识', source: '张松', desc: '出牌阶段开始时，你可以展示一名其他角色的一张手牌，然后当你本阶段使用与此牌类别相同的牌时，你可以摸一张牌。' },
      { name: '献图', source: '张松', desc: '其他角色的出牌阶段开始时，你可以摸两张牌并交给该角色两张牌，然后此阶段结束时，若其本阶段没有造成过伤害，你失去1点体力。' },
      { name: '八阵', source: '卧龙诸葛亮', desc: '锁定技，若你的装备区里没有防具牌，视为你装备着【八卦阵】。' },
      { name: '火计', source: '卧龙诸葛亮', desc: '出牌阶段，你可以将一张红色手牌当【火攻】使用。' },
      { name: '看破', source: '卧龙诸葛亮', desc: '你可以将一张黑色手牌当【无懈可击】使用。' },
      { name: '享乐', source: '刘禅', desc: '锁定技，当你成为一名角色使用【杀】的目标后，该角色选择一项：1.弃置一张基本牌；2.令此【杀】对你无效。' },
      { name: '放权', source: '刘禅', desc: '你可以跳过出牌阶段，然后本回合结束时，你可以弃置一张手牌，令一名其他角色执行一个额外的回合。' },
      { name: '甚贤', source: '张星彩', desc: '每名其他角色的回合限一次，当其他角色因弃置而失去基本牌后，你可以摸一张牌。' },
      { name: '枪舞', source: '张星彩', desc: '出牌阶段限一次，你可以进行一次判定，然后本回合你使用点数小于/大于判定结果的【杀】无距离/次数限制。' },
      { name: '福绵', source: '吴苋', desc: '准备阶段，你可以选择一项：1.本回合下一个摸牌阶段多摸一张牌；2.本回合限一次，使用红色牌可以额外选择一个目标。若你选择的选项与记录不同，则将本次选项效果改为多摸两张牌或额外选择两个目标，否则你记录本回合选择的选项直到你的下个回合结束。' },
      { name: '怠宴', source: '吴苋', desc: '结束阶段，你可以令一名其他角色从牌堆中随机获得一张♥️基本牌，然后若你选择的角色与你上个回合发动此技能选择的角色相同，其失去1点体力。' },
      { name: '谦雅', source: '孙乾', desc: '当你成为锦囊牌的目标后，你可以将任意张手牌交给一名其他角色。' },
      { name: '说盟', source: '孙乾', desc: '出牌阶段结束时，你可以与一名角色拼点。若你赢，则你视为使用一张【无中生有】，否则其视为对你使用一张【过河拆桥】。' },
      { name: '良助', source: 'SP孙尚香', desc: '当一名角色于其出牌阶段内回复体力后，你可以选择一项：1.摸一张牌；2.令其摸两张牌。' },
      { name: '督粮', source: '李严', desc: '出牌阶段限一次，你可以获得一名其他角色的一张牌并选择一项：1.观看牌堆顶的两张牌，选择其中的至多两张基本牌并令其获得之；2.令其于其下个回合的摸牌阶段多摸一张牌。' },
      { name: '腹鳞', source: '李严', desc: '锁定技，你于回合内获得的牌不计入你本回合的手牌上限。' },
      { name: '谏征', source: '秦宓', desc: '当其他角色使用【杀】指定目标时，若你在其攻击范围内且你不是目标，你可以将一张手牌置于牌堆顶，取消所有目标，然后若此【杀】不为黑色，你成为目标。' },
      { name: '专对', source: '秦宓', desc: '当你使用【杀】指定其他角色为目标后/成为其他角色使用【杀】的目标后，你可以与其拼点，若你赢，其不能使用【闪】响应此【杀】/此【杀】对你无效。' },
      { name: '天辩', source: '秦宓', desc: '当你拼点时，你可以改为用牌堆顶的一张牌拼点。当你的拼点牌亮出后，若花色为♥️，则点数视为K。' },
      { name: '三顾', source: '诸葛尚', desc: '结束阶段，你可以在【杀】或普通锦囊牌中依次记录至多三张不同的牌名（【借刀杀人】和【无懈可击】除外），然后选择一名其他角色（若记录的牌均为你本回合使用过的牌，防止其使用以此法转化的牌对你造成的伤害）。其下个出牌阶段内的手牌均视为当前记录中最先记录的牌名，其每使用一张牌时便移除该记录，此阶段结束时你移除所有记录。' },
      { name: '铁祖', source: '诸葛尚', desc: '锁定技，每回合限一次，当你成为【杀】或【决斗】的目标后，若你的体力值不大于使用者，你回复1点体力。' },
      { name: '识命', source: '谯周', desc: '每轮限一次，一名角色的摸牌阶段开始时，你可以观看牌堆顶的三张牌，然后你可以将其中一张牌置于牌堆底。若如此做，该角色可以放弃摸牌并对自己造成1点伤害，然后其从牌堆底摸三张牌。' },
      { name: '将息', source: '谯周', desc: '一名角色的回合结束时，若本回合：一号位进入过濒死状态或未受到过伤害，你重置“识命”并摸一张牌；所有角色均未受到过伤害，你可以与该角色各摸一张牌。' },
      { name: '图南', source: '吕凯', desc: '出牌阶段限一次，你可以令一名其他角色观看牌堆顶的一张牌，然后其选择一项：1.使用此牌（无距离限制）；2.将此牌当【杀】使用。' },
      { name: '闭境', source: '吕凯', desc: '结束阶段，你可以将至多两张手牌标记为“闭境”牌：1.准备阶段，你重铸手牌中的“闭境”牌；2.其他角色的弃牌阶段开始时，若你本回合失去过“闭境”牌，其弃置两张牌。' },
      { name: '秉正', source: '董允', desc: '出牌阶段结束时，你可以选择一名手牌数不等于体力值的角色，令其弃置一张手牌或令其摸一张牌。若该角色的手牌数等于体力值，你摸一张牌，并可以交给其一张牌。' },
      { name: '舍宴', source: '董允', desc: '当你成为普通锦囊牌的目标时，你可以选择一名不为此牌唯一目标的角色，若其为此牌的目标，则此牌对其无效，否则其成为此牌的目标。' },
      { name: '无言', source: 'SP徐庶', desc: '锁定技，当你使用锦囊牌造成伤害时，或受到锦囊牌造成的伤害时，防止此伤害。' },
      { name: '举荐', source: 'SP徐庶', desc: '结束阶段，你可以弃置一张非基本牌，令一名其他角色选择一项：1.摸两张牌；2.回复1点体力；3.复原武将牌。' },
      { name: '资援', source: '糜竺', desc: '出牌阶段限一次，你可以将任意张点数之和为13的手牌交给一名其他角色，令其回复1点体力。' },
      { name: '巨贾', source: '糜竺', desc: '锁定技，你的手牌上限+X。游戏开始时，你多摸X张牌（X为你的体力上限）。' },
      { name: '雪恨', source: '关银屏', desc: '出牌阶段限一次，你可以弃置一张红色牌，选择至多X名角色（X为你已损失的体力值且至少为1），然后你横置这些角色，并对其中一名角色造成1点火焰伤害。' },
      { name: '虎啸', source: '关银屏', desc: '锁定技，当你对一名角色造成火焰伤害后，其摸一张牌，然后你本回合对其使用牌无次数限制。' }

      { name: '咆哮', source: '张飞', desc: '锁定技，你使用【杀】无次数限制。当你使用的【杀】被抵消后，你本回合下一次使用【杀】造成的伤害+1。' },

      { name: '马术', source: '马超', desc: '锁定技，你计算与其他角色的距离-1。' },

      { name: '凤魄', source: '马云騄', desc: '当你于回合内使用第一张【杀】或第一张【决斗】指定一名角色为唯一目标后，你可以选择一项：1.摸X张牌且此牌造成的伤害+1；2.摸一张牌且此牌造成的伤害+X（X为其♦️牌数）。' },
      { name: '忧戎', source: '张嶷', desc: '出牌阶段限一次，你可以与一名其他角色同时展示一张手牌，若你与其展示的牌为【杀】与非【闪】/非【杀】与【闪】，你对其造成1点伤害/获得其一张牌。' },

      { name: '峻刑', source: '满宠', desc: '出牌阶段限一次，你可以弃置任意张手牌并令一名其他角色选择一项：1.弃置等量的牌并失去1点体力，2.翻面并摸等量张牌。' },
      { name: '御策', source: '满宠', desc: '当你受到伤害后，你可展示一张手牌，除非伤害来源弃置一张与之类别不同的手牌，否则你回复1点体力。' },
      { name: '驱虎', source: '荀彧', desc: '出牌阶段限一次，你可以与一名体力值大于你的角色拼点，若你赢，则该角色对其攻击范围内你选择的一名角色造成1点伤害，否则其对你造成1点伤害。' },
      { name: '节命', source: '荀彧', desc: '当你受到1点伤害后，你可以令一名角色将手牌摸至体力上限（至多摸至五张）。' },
      { name: '行殇', source: '曹丕', desc: '当其他角色死亡时，你可获得其所有牌。' },
      { name: '放逐', source: '曹丕', desc: '当你受到伤害后，你可令一名其他角色翻面并摸X张牌（X为你已损失体力值）。' },
      { name: '恂恂', source: '李典', desc: '摸牌阶段，你可观看牌堆顶四张牌，然后将其中两张置于牌堆顶，其余置入牌堆底。' },
      { name: '忘隙', source: '李典', desc: '你造成或受到其他角色的1点伤害后，你可摸2张牌，然后交给其一张牌。' },
      { name: '郡兵', source: '司马朗', desc: '一名角色的结束阶段，若其手牌数小于2，其可以摸一张牌并交给你所有手牌，然后你交给该角色等量的牌。' },
      { name: '去疾', source: '司马朗', desc: '出牌阶段限一次，你可以弃置X张牌（X为你已损失的体力值），令至多X名角色各回复1点体力。若弃置的牌中包含黑色牌，你失去1点体力。' },
      { name: '先辅', source: '戏志才', desc: '锁定技，游戏开始时，你选择一名其他角色，当其受到伤害后，你受到等量伤害;其回复体力后，你回复等量的体力。' },
      { name: '筹策', source: '戏志才', desc: '当你受到1点伤害后，你可进行判定，若为红色，令一名角色摸一张牌，若其是“先辅”角色，改为摸2张。' },
      { name: '陈情', source: 'SP蔡文姬', desc: '每轮限一次，当一名角色进入濒死状态时，你可以令另一名其他角色摸四张牌并弃置四张牌。若其弃置的牌花色均不相同，其视为对濒死状态的角色使用【桃】。' },
      { name: '默识', source: 'SP蔡文姬', desc: '结束阶段，你可以将一张手牌当你本回合出牌阶段内使用过的第一和第二张基本牌或普通锦囊牌使用。' },
      { name: '别君', source: '李婉', desc: '其他角色的出牌阶段限一次，其可以交给你一张手牌。你每回合第一次受到伤害时，若你手牌中没有本回合以此法获得的牌，你可以翻面，防止此伤害。' },
      { name: '联对', source: '李婉', desc: '你是用牌时，若上一张牌使用者不是你，你可令其摸2张牌。其他橘色使用牌时，若上一张牌使用者是你，其可令你摸2张牌。' },
      { name: '备预', source: '司马孚', desc: '出牌阶段限一次，你可以将手牌摸至体力上限，然后将一种花色的所有手牌置于牌堆底。' },
      { name: '督持', source: '司马孚', desc: '每回合限一次，当你成为其他角色使用牌的目标后，你可以从牌堆底摸一张牌并展示所有手牌，若你的手牌颜色均相同，此牌对你无效。' },
      { name: '工巧', source: '马钧', desc: '出牌阶段限一次，你可将1张手牌置于你的任意装备栏(替换原装备);若你的装备区里有：基本牌，你使用的基本牌基础值+1；锦囊牌，每回合首次使用一种种类别的牌后，你摸一张牌；装备牌，你的手牌上限+3。' },
      { name: '精益', source: '马钧', desc: '锁定技，有牌进入你的装备区后，你摸X张牌，然后弃置2张牌(X为你装备区内的牌数)。每个副类别每回合限一次。' },
      { name: '严教', source: '张昌蒲', desc: '出牌阶段限一次，你可以选择一名其他角色并亮出牌堆顶的四张牌，令该角色将这些牌分成点数之和相等的两组并将这两组牌分配给你与其，然后将剩余未分组的牌置入弃牌堆。若未分组的牌数大于1，你本回合的手牌上限-1。' },
      { name: '省身', source: '张昌蒲', desc: '当你受到伤害后，你可以摸一张牌（若你的手牌数为全场最少，改为摸两张牌），令下一次发动“严教”亮出的牌数+1（若你的体力值为全场最少，改为+2）且至多+4。' },
      { name: '遣信', source: '张恭', desc: '出牌阶段限一次，若牌堆中没有“信”，你可令所有角色依次选择一张手牌，然后将这些牌随机置入牌堆的上半部分中，称为“信”。当你获得“信”时，你将手牌摸至4张，并可令当前回合角色本回合手牌上限-2。当其他角色获得“信”时，你摸一张牌。' },
      { name: '镇行', source: '张恭', desc: '结束阶段，或当你受到伤害后，你可观看牌堆顶的三张牌，获得其中一张与其余牌花色均不相同的牌，将剩余的牌置于牌堆顶并标记为“信”。' },
      { name: '秘计', source: '王异', desc: '结束阶段，你可以摸X张牌（X为你已损失的体力值），然后可以将等量的手牌交给其他角色。' },
      { name: '贞烈', source: '王异', desc: '当你成为其他角色使用【杀】或普通锦囊牌的目标后，你可以失去1点体力，令此牌对你无效，然后你弃置其一张牌。' },
    ],
    4: [
      { name: '奸雄', source: '曹操', desc: '当你受到伤害后，你可以摸1张牌并获得造成此伤害的牌。' },
      { name: '刚烈', source: '夏侯惇', desc: '当你受到伤害后，你可进行判定，若为红色，对来源造成1点伤害;若为黑色，弃来源一张牌。' },
      { name: '清俭', source: '夏侯惇', desc: '摸牌阶段外获得牌后，你可展示任意张牌并交给一名其他角色。(每回合限一次，你每以此法给出一种类别的牌，当前回合角色手牌上限+1)' },
      { name: '突袭', source: '张辽', desc: '摸牌阶段，你可以少摸任意张牌，然后获得等量名其他角色的各一张手牌。' },
      { name: '裸衣', source: '许褚', desc: '摸牌阶段开始时，你亮出牌堆顶的三张牌，然后你可以：获得其中的基本牌、武器牌和【决斗】，并放弃摸牌，然后直到你的下回合开始，你为伤害来源的【杀】或【决斗】造成的伤害+1。' },
      { name: '精策', source: '郭淮', desc: '结束阶段，若你本回合使用过的牌数大于等于你的体力值，你可执行一个额外的摸牌或出牌阶段。(若这些牌花色数也大于等于你的体力值，则两项都选。)' },
      { name: '镇军', source: '于禁', desc: '准备阶段或结束阶段，你可以弃置一名角色的X张牌（X为其手牌数减体力值且至少为1），然后若其中没有装备牌，你选择一项：1.弃置一张牌；2.令该角色摸等量张牌。' },
      { name: '将驰', source: '曹彰', desc: '出牌阶段开始时，你可以选择一项：1.摸两张牌，然后本阶段不能使用或打出【杀】；2.摸一张牌；3.弃置一张牌，然后本阶段使用【杀】无距离限制且使用【杀】的次数上限+1。' },
      { name: '慎断', source: '韩浩史涣', desc: '当你的黑色非锦囊牌因弃置而置入弃牌堆时，你可以将此牌当无距离限制的【兵粮寸断】使用。' },
      { name: '勇略', source: '韩浩史涣', desc: '其他角色的判定阶段开始时，你可以弃置其判定区内的一张牌。若该角色在你的攻击范围内，则你摸一张牌，否则你视为对其使用一张【杀】。' },
      { name: '慷忾', source: '曹昂', desc: '当一名角色成为【杀】的目标后，若你与其距离1以内，你可以摸一张牌，然后交给其一张牌并展示之。若此牌为装备牌，该角色可以使用此牌。' },
      { name: '千驹', source: '曹休', desc: '锁定技，你计算与其他角色的距离-X（X为你已损失体力值）。' },
      { name: '倾袭', source: '曹休', desc: '当你使用【杀】或【决斗】指定目标后，你可以令其选择一项：1.弃置等同于你攻击范围内的角色数张手牌(若你武器区里有武器牌，则至多为4，然后弃置你装备区里的武器牌，否则至多为2);2.令此牌对其造成的伤害+1且其进行一次判定，若结果为红色，该角色不能响应此牌。' },
      { name: '权计', source: '钟会', desc: '当你受到1点伤害后，或你的牌被其他角色获得后，你可以摸一张牌并将一张手牌置于你的武将牌上，称为“权”（你的手牌上限增加“权”的数量）。' },
      { name: '险卫', source: '曹安民', desc: '锁定技，准备阶段，你废除一个装备栏，并摸未废除装备栏数张牌，然后令一名其他角色使用牌堆中第一张对应副类别的装备牌，若牌堆中没有，其摸一张牌。当你的装备栏均被废除后，你加2点体力上限，然后你和所有其他角色始终互相视为在对方的攻击范围内。' },
      { name: '神速', source: '夏侯渊', desc: '你可以：1.跳过判定阶段和摸牌阶段；2.跳过出牌阶段并弃置一张装备牌；3.跳过弃牌阶段并翻面。当你执行一项后，视为你使用一张无距离限制的【杀】。' },
      { name: '据守', source: '曹仁', desc: '结束阶段，你可以摸四张牌并翻面，然后弃置一张手牌（若此牌为装备牌，你改为使用之）。' },
      { name: '解围', source: '曹仁', desc: '你可以将装备区里的一张牌当【无懈可击】使用。当你的武将牌从背面翻至正面时，你可以弃置一张牌，然后移动场上的一张牌。' },
      { name: '强袭', source: '典韦', desc: '出牌阶段限一次，你可失去1点体力或弃置1张武器牌，对攻击范围内的一名其他角色造成1点伤害。' },
      { name: '巧变', source: '张郃', desc: '你可以弃置一张手牌，跳过一个阶段（准备阶段和结束阶段除外）。若你以此法跳过了：摸牌阶段，你可以获得至多两名角色的各一张手牌；出牌阶段，你可以移动场上的一张牌。' },
      { name: '屯田', source: '邓艾', desc: '当你于回合外失去牌后，你可以进行一次判定，若结果不为♥️，你将此判定牌置于你的武将牌上，称为“田”（你计算与其他角色的距离-X，X为“田”的数量）。' },
      { name: '礼赂', source: '曹嵩', desc: '摸牌阶段，你可以改为将手牌摸至体力上限（至多摸至五张），然后交给一名其他角色至少一张手牌。若你给出的牌数大于你上一次以此法给出的牌数，你加1点体力上限并回复1点体力。' },
      { name: '翊正', source: '曹嵩', desc: '结束阶段，你可以选择一名其他角色。直到你的下回合开始，当该角色造成伤害或回复体力时，若其体力上限小于你，你减1点体力上限，然后此伤害值或回复值+1。' },
      { name: '威虏', source: '吕虔', desc: '锁定技，你受到其他角色造成的伤害后，伤害来源在你下回合出牌阶段开始时失去体力值直到剩1点体力，然后回合结束时回复以此法失去的体力值。' },
      { name: '仇讨', source: '阎柔', desc: '当你使用【杀】指定目标后或成为【杀】目标后，你可弃置此【杀】使用者一张牌，令此【杀】不能被抵消。(若你是使用者，此【杀】不计入次数)' },
      { name: '伉厉', source: '孙礼', desc: '当你造成或受到伤害后，你可摸两张牌，然后你下次造成伤害时弃置这些牌。' },
      { name: '决死', source: 'SP庞德', desc: '出牌阶段，你可以弃置一张【杀】，令一名你攻击范围内的其他角色弃置一张牌。若其弃置的不是【杀】且你的体力值不大于该角色，视为你对其使用一张【决斗】。' },  
      { name: '马术', source: 'SP庞德', desc: '锁定技，你计算与其他角色的距离-1。' }, 
      { name: '战意', source: '朱灵', desc: '出牌阶段开始时，你可以弃置一种类别的所有牌，然后直到你的下个回合开始，另外两种类别的牌：基本牌，你使用时无距离限制且回复值或伤害值+1；锦囊牌，不计入你的手牌上限且你使用时摸一张牌；装备牌，置入你的装备区时可以选择一名其他角色的一张牌并令其弃置之。' }, 
      { name: '齐眉', source: '宣公主', desc: '出牌阶段限一次，你可以与一名其他角色各摸两张牌然后与其依次展示至多三张手牌。若展示牌中包含的花色数为：1，你依次使用这些牌；2，你与其复原武将牌并各回复1点体力；3，你与其重铸这些牌；4，你与其各摸一张牌。' }, 
      { name: '追姬', source: '宣公主', desc: '当你死亡时，你可以令一名其他角色随机使用牌堆或弃牌堆中其未装备类别的装备牌直到无法使用（当其失去以此法使用的装备牌后，废除其对应的装备栏）。' }, 
      { name: '镇卫', source: '文聘', desc: '当一名体力值不大于你的其他角色成为另一名其他角色使用【杀】或黑色锦囊牌的唯一目标时，你可以弃置一张牌并选择一项：1.摸一张牌，将此牌转移给你；2.令此牌无效，然后使用者于当前回合结束时重新获得此牌。' },
      { name: '镇锋', source: '费曜', desc: '每个回合限一次，当其他角色于其回合内使用一张牌时，若其手牌数不大于体力值，你可以猜测其手牌中与此牌类别相同的牌数。若你：猜对，你摸X张牌（X为你连续猜对的次数，至多为5）并视为对其使用一张【杀】；猜错且差值大于1，其视为对你使用一张【杀】。' }, 
      { name: '蓄志', source: '令狐愚', desc: '出牌阶段限一次，你可以令两名有手牌的角色选择任意张手牌，然后交换选择的牌。若交换前选择的牌数不同，则选择牌数较多的角色视为使用一张无距离与次数限制的【杀】，否则你摸两张牌且本阶段发动此技能的次数上限+1（不能选择本阶段选择过的角色）。' }, 
      { name: '蹙国', source: '夏侯楙', desc: '锁定技，当你每回合第一次使用牌被抵消后，你弃置一张牌，令此牌对目标角色再结算一次，然后若仍被抵消，你失去1点体力。' }, 
      { name: '统围', source: '夏侯楙', desc: '出牌阶段限一次，你可以选择一名其他角色并重铸两张牌。然后当其下一次使用牌结算结束后，若此牌的点数在你上次以此法重铸的两张牌之间，你视为对其使用一张【杀】或【过河拆桥】。' }, 
      { name: '功獒', source: '诸葛诞', desc: '锁定技，当其他角色第一次进入濒死状态时，你加1点体力上限，回复1点体力。' },
      { name: '困奋', source: 'SP姜维', desc: '锁定技，结束阶段，你失去1点体力，摸两张牌。' }, 
      { name: '慑伏', source: '车胄', desc: '锁定技，你的牌造成的伤害改为X，其他角色的牌对你造成的伤害改为X（X为此牌在使用者手牌区中的轮数）。' }, 
      { name: '披挂', source: '车胄', desc: '当你对其他角色造成伤害时，若此伤害大于1，你可以获得该角色的至多游戏轮数张手牌（这些牌本回合不计入手牌上限）。' }, 
      { name: '断粮', source: '徐晃', desc: '出牌阶段，你可以将一张黑色非锦囊牌当【兵粮寸断】使用。你对手牌数不小于你的角色使用【兵粮寸断】无距离限制。' },
      { name: '截辎', source: '徐晃', desc: '锁定技，当一名其他角色跳过摸牌阶段后，你摸一张牌。' },
      { name: '独往', source: '韩龙', desc: '锁定技，游戏开始时，将牌堆顶的五张不为【杀】的牌置于你的武将牌上，称为“刺”。若你的武将牌上有“刺”，你计算与其他角色、其他角色计算与你的距离均+1。' },
      { name: '刺北', source: '韩龙', desc: '当一名角色使用的【杀】进入弃牌堆时，若此【杀】造成过伤害，你可以用一张不为【杀】的“刺”交换此牌，然后弃置一名角色区域内的一张牌。一名角色的回合结束时，若你武将牌上的“刺”均为【杀】，你获得所有“刺”（以此法获得的【杀】不能被弃置、不计入手牌上限、使用时无距离与次数限制）。' },
      { name: '司敌', source: '曹真', desc: '结束阶段，你可以将一张非基本牌置于你的武将牌上，称为“司”。其他角色的出牌阶段开始时，你可以移去一张“司”，令该角色本阶段不能使用或打出与此“司”颜色相同的牌，然后此阶段结束时，若其本阶段未使用过：【杀】，你视为对其使用一张【杀】；锦囊牌，你摸两张牌。' },


    ],

  },
  '吴': {
    3: [
      { name: '英姿', source: '周瑜', desc: '锁定技，摸牌阶段，你多摸一张牌。你的手牌上限等于X（X为你的体力上限）。' },
      { name: '反间', source: '周瑜', desc: '出牌阶段限一次，你可以展示一张手牌并交给一名其他角色，令其选择一项：1.展示所有手牌，弃置与此牌花色相同的所有牌；2.失去1点体力。' },
      { name: '国色', source: '大乔', desc: '出牌阶段限一次，你可以选择一张♦️牌并选择一名其他角色，若其判定区有【乐不思蜀】，则你弃置此♦️牌并弃置其判定区里的【乐不思蜀】，否则你将此♦️牌当【乐不思蜀】对其使用。若如此做，你摸一张牌。' },
      { name: '流离', source: '大乔', desc: '当你成为其他角色使用【杀】的目标时，你可以弃置一张牌，将此【杀】转移给你攻击范围内的另一名其他角色。' },
      { name: '谦逊', source: '陆逊', desc: '当一张延时锦囊牌或其他角色使用的普通锦囊牌对你生效时，若你是此牌的唯一目标，你可以将所有手牌置于你的武将牌上，然后你于当前回合结束时获得之。' },
      { name: '连营', source: '陆逊', desc: '当你失去最后的手牌后，你可以令至多X名角色各摸一张牌（X为你此次失去的手牌数）。' },
      { name: '结姻', source: '孙尚香', desc: '出牌阶段限一次，你可以选择一名男性角色，弃置一张手牌或将一张装备牌置入其装备区，然后你与其之中：体力值较高的角色摸一张牌、体力值较低的角色回复1点体力。' },
      { name: '枭姬', source: '孙尚香', desc: '当你失去装备区里的一张牌后，你可以摸两张牌。' },
      { name: '谮毁', source: '孙鲁班', desc: '当你使用【杀】或普通锦囊牌指定一名角色为唯一目标时，你可以令另一名能成为此牌目标的其他角色选择一项：1.交给你一张牌，然后代替你成为此牌的使用者；2.也成为此牌的目标，然后此技能本回合失效。' },
      { name: '骄矜', source: '孙鲁班', desc: '当你成为其他角色使用【杀】或普通锦囊牌的目标后，你可以弃置一张装备牌，令此牌对你无效，且你于此牌结算结束后获得此牌。然后若该角色为女性，本回合此技能失效。' },
      { name: '宴诛', source: '孙休', desc: '出牌阶段限一次，你可以令一名其他角色选择一项：1.弃置一张牌且下次受到伤害+1直到其下回合开始。2.令你获得其装备区里的所有牌（至少一张），然后你将此技能修改为此技能为：出牌阶段限一次，你可以令一名其他角色下次受到伤害+1直到其下回合开始。' },
      { name: '兴学', source: '孙休', desc: '结束阶段，你可以令至多X名角色依次摸一张牌，然后其中手牌数大于体力值的角色依次将一张牌置于牌堆顶（若你拥有技能“宴诛”且未修改过之，则X为你的体力值，否则X为你的体力上限）。' },
      { name: '慎行', source: '顾雍', desc: '出牌阶段，你可以弃置X张牌，摸一张牌（X为此前本阶段此技能发动次数，至多为2）。' },
      { name: '秉壹', source: '顾雍', desc: '结束阶段，你可以展示所有手牌。若这些牌：颜色均相同，你令至多手牌数名角色各摸一张牌；颜色点数均相同，你摸一张牌。' },
      { name: '纵玄', source: '虞翻', desc: '当你的牌因弃置而置入弃牌堆时，你可以依次执行任意项：1.令一名其他角色获得其中一张锦囊牌；2.将其中任意张牌置于牌堆顶。' },
      { name: '直言', source: '虞翻', desc: '结束阶段，你可以令一名角色摸一张牌并展示之，若此牌为：基本牌，你摸一张牌；装备牌，其使用此牌并回复1点体力。' },
      { name: '甘露', source: '吴国太', desc: '出牌阶段限一次，你可以令两名角色交换装备区里的牌，然后若他们装备区里的牌数之差大于X（X为你已损失的体力值），你弃置两张手牌。' },
      { name: '补益', source: '吴国太', desc: '当一名角色进入濒死状态时，你可以展示其一张手牌，然后若此牌不为基本牌，该角色弃置此牌并回复1点体力。若其因此弃置了最后的手牌，其摸一张牌。' },
      { name: '安恤', source: '步练师', desc: '出牌阶段限一次，你可以选择两名手牌数不相等的其他角色，令手牌数小的一方获得另一方的一张手牌并展示之，然后若：此牌不为♠️，你摸一张牌；双方的手牌数因此相等，你回复1点体力。' },
      { name: '追忆', source: '步练师', desc: '当你死亡时，你可以令一名其他角色（杀死你的角色除外）摸X张牌（X为存活角色数）并回复1点体力。' },
      { name: '天香', source: '小乔', desc: '当你受到伤害时，你可以弃置一张♥️手牌，防止此伤害，选择一名其他角色并选择一项：1.令其受到伤害来源对其造成的1点伤害并摸X张牌（X为其已损失的体力值，至多为5）；2.令其失去1点体力并获得你弃置的牌。' },
      { name: '红颜', source: '小乔', desc: '锁定技，你的♠️牌均视为♥️牌。' },
      { name: '好施', source: '鲁肃', desc: '摸牌阶段，你可以多摸两张牌，然后若你的手牌数大于5，你将一半的手牌（向下取整）交给手牌最少的一名其他角色。' },
      { name: '缔盟', source: '鲁肃', desc: '出牌阶段限一次，你可以选择两名其他角色并弃置X张牌（X为这两名角色手牌数的差），然后令这两名角色交换手牌。' },
      { name: '直谏', source: '张昭张纮', desc: '出牌阶段，你可以将手牌中的一张装备牌置入一名其他角色的装备区（不可替换原装备）并摸一张牌。' },
      { name: '固政', source: '张昭张纮', desc: '其他角色的弃牌阶段结束时，你可以将本阶段因弃置而置入弃牌堆的牌中的一张牌交给该角色，然后你可以获得其余的牌。' },
      { name: '弘德', source: '步骘', desc: '当你一次性获得或失去至少两张牌时，你可以令一名角色摸一张牌。' },
      { name: '定叛', source: '步骘', desc: '出牌阶段限X次（X为场上存活角色数且至多为5），你可以令一名装备区有牌的角色摸一张牌并选择一项：1.令你弃置其装备区里的一张牌；2.收回装备区里的牌，然后受到你造成的1点伤害。' },
      { name: '缓释', source: '诸葛瑾', desc: '当一名角色的判定牌生效前，你可以令其观看你的手牌并选择你的一张牌，然后你打出此牌代替判定牌。' },
      { name: '弘援', source: '诸葛瑾', desc: '摸牌阶段，你可以少摸一张牌，令至多两名其他角色各摸一张牌。' },
      { name: '明哲', source: '诸葛瑾', desc: '当你于回合外因使用、打出或弃置而失去一张红色牌时，你可以摸一张牌。' },
      { name: '观潮', source: '严畯', desc: '出牌阶段开始时，你可以在严格递增与严格递减中选择一项，当你本阶段使用牌时，若你本阶段使用过的所有牌的点数均符合你选择的规律，你摸一张牌。' },
      { name: '逊贤', source: '严畯', desc: '每回合限一次，当你使用或打出的牌置入弃牌堆时，你可以将之交给一名手牌数或体力值大于你的角色。' },
      { name: '复难', source: '薛综', desc: '当其他角色使用或打出牌响应你使用的牌时，你可以令其获得你使用的牌（其本回合不能使用或打出此牌），然后你获得其使用或打出的牌。' },
      { name: '诚训', source: '薛综', desc: '结束阶段，你可以令一名其他角色摸等同于场上♦️牌数的牌，然后其弃置X张牌（X为此前此技能发动过的次数）。若该角色因此弃置了所有牌，你失去此技能，然后删去“复难”中令其他角色获得你使用的牌的效果。' },
      { name: '观微', source: '潘濬', desc: '每回合限一次，一名角色的出牌阶段结束后，若其本回合使用过至少两张牌且这些牌花色均相同，你可以弃置一张牌，令其摸两张牌并执行一个额外的出牌阶段。' },
      { name: '公清', source: '潘濬', desc: '锁定技，当你受到伤害时，若伤害来源的攻击范围：小于3，将此次伤害的伤害值改为1；大于3，此伤害+1。' },
      { name: '过论', source: 'SP庞统', desc: '出牌阶段限一次，你可以展示一名其他角色的一张手牌，然后你可以用你的一张牌交换此牌。若如此做，交换前点数小的一方摸一张牌。' },
      { name: '断发', source: '周鲂', desc: '出牌阶段，你可以弃置任意张黑色牌（本阶段至多以此法弃置体力上限张牌），摸等量张牌。' },
      { name: '诱敌', source: '周鲂', desc: '结束阶段，你可以令一名其他角色弃置你的一张手牌，若此牌不为：【杀】，你获得其一张牌；黑色牌，你摸一张牌。' },
      { name: '表召', source: '许贡', desc: '结束阶段，你可以将一张牌置于你的武将牌上，称为“表”：1.当一张与“表”花色点数均相同的牌置入弃牌堆后，你移去“表”（若此牌为其他角色弃置的，改为其获得“表”）并失去1点体力；2.准备阶段，若你的武将牌上有“表”，你移去“表”，令一名角色回复1点体力并将手牌摸至与全场手牌数最多的角色相同（至多摸五张）。' },
      { name: '业仇', source: '许贡', desc: '当你死亡时，你可以选择一名已损失体力值大于1的角色。直到其下个回合开始，其于每个回合结束时失去1点体力。' },
      { name: '问卦', source: '徐氏', desc: '每名角色的出牌阶段限一次，其可以交给你一张牌，然后你可以将此牌置于牌堆顶或牌堆底，你（若其不为你，改为你与其）从另一端摸一张牌。' },
      { name: '伏诛', source: '徐氏', desc: '一名男性角色的结束阶段，若牌堆剩余牌数不大于你体力值的十倍，你可以对其依次使用牌堆中所有的【杀】（至多为游戏人数），然后洗牌。' },
    ],
    4: [
      { name: '制衡', source: '孙权', desc: '出牌阶段限一次，你可以弃置任意张牌，然后摸等量的牌（若你以此法弃置了所有的手牌，则多摸一张牌）。' },
      { name: '奇袭', source: '甘宁', desc: '出牌阶段，你可以将一张黑色牌当【过河拆桥】使用。' },
      { name: '克己', source: '吕蒙', desc: '若你未于本回合的出牌阶段内使用或打出过【杀】，你可以跳过弃牌阶段。' },
      { name: '苦肉', source: '黄盖', desc: '出牌阶段限一次，你可以弃置一张牌，失去1点体力。' },
      { name: '诈降', source: '黄盖', desc: '锁定技，当你失去1点体力后，你摸三张牌，然后若此时是你的出牌阶段，你本阶段：使用红色【杀】无距离限制且不能被【闪】响应、使用【杀】的次数上限+1。' },
      { name: '邀名', source: '全琮', desc: '每回合每个选项限一次，当你造成或受到伤害后，你可以选择一项：1.弃置一名其他角色的一张手牌；2.令一名其他角色摸一张牌；3.令一名角色弃置至多两张牌并摸等量的牌。' },
      { name: '胆守', source: '朱然', desc: '每回合限一次，当你成为非装备牌的目标后，你可以摸X张牌（X为你本回合成为过非装备牌目标的次数）。一名角色的结束阶段，若你本回合没有发动此技能摸过牌，你可以弃置其手牌数张牌，对其造成1点伤害。' },
      { name: '厉火', source: '程普', desc: '当你使用火【杀】时，你可以多选择一个目标。当你使用普通【杀】时，你可以将此【杀】改为火【杀】，然后此【杀】结算结束后，若此【杀】造成过伤害，你失去1点体力。当你每回合使用第一张牌结算结束后，若此牌为【杀】，你可以将此牌置入“醇”。' },
      { name: '醇醪', source: '程普', desc: '出牌阶段结束时，若你的武将牌上没有“醇”，你可以将任意张【杀】置于你的武将牌上，称为“醇”（当一名角色处于濒死状态时，你可以移去一张“醇”，令该角色视为使用一张【酒】，然后若你移去的“醇”为：雷【杀】，你摸两张牌；火【杀】，你回复1点体力）。' },
      { name: '破军', source: '徐盛', desc: '当你使用【杀】指定一名角色为目标后，你可以将该角色的至多X张牌（X为该角色的体力值）置于其武将牌上（若你以此法选择的牌中有：装备牌，你弃置其中一张装备牌；锦囊牌，你摸一张牌），然后当前回合结束时，其获得武将牌上的牌。' },
      { name: '夺刀', source: '潘璋马忠', desc: '当你成为其他角色使用【杀】的目标后，你可以弃置一张牌，获得其装备区里的武器牌。' },
      { name: '暗箭', source: '潘璋马忠', desc: '锁定技，当你使用【杀】指定一名角色为目标后，若你不在其攻击范围内，此【杀】对其造成的伤害+1且无视其防具。若其因此进入濒死状态，其不能在此次濒死结算中使用【桃】。' },
      { name: '旋风', source: '凌统', desc: '当你于弃牌阶段弃置至少两张牌，或当你失去装备区里的牌后，你可以依次弃置任意名其他角色的共计至多两张牌。然后若此时是你的回合内，你可以对其中的一名角色造成1点伤害。' },
      { name: '弓骑', source: '韩当', desc: '出牌阶段限一次，你可以弃置一张牌，令你本阶段攻击范围无限且使用与此牌花色相同的【杀】无次数限制，然后若此牌为装备牌，你可以弃置一名其他角色的一张牌。' },
      { name: '奋励', source: '朱桓', desc: '若你的手牌数/体力值/装备区里的牌数（装备区里须有牌）为全场最大，你可以跳过判定与摸牌阶段/出牌阶段/弃牌阶段。' },
      { name: '平寇', source: '朱桓', desc: '回合结束时，你可以对至多X名其他角色各造成1点伤害（X为你本回合跳过的阶段数），然后若你选择的角色数小于X，你再选择其中一名角色，令其随机弃置装备区里的一张牌。' },
      { name: '匡弼', source: '孙登', desc: '出牌阶段开始时，你可以令一名其他角色将至多三张牌置于你的武将牌上直到本阶段结束（当你使用牌时，若“匡弼”牌中没有与此牌花色相同的牌，则你随机移去一张“匡弼”牌并摸一张牌，否则移去一张此花色的“匡弼”牌并与该角色各摸一张牌）。' },
      { name: '安国', source: '朱治', desc: '出牌阶段限一次，你可以选择一名其他角色，若其手牌数/体力值/装备区内的牌数为全场最少，其摸一张牌/回复1点体力/随机使用一张装备牌。若：该角色有未执行的分支且你满足条件，你执行之；你与其执行了全部分支，你可以重铸任意张牌。' },
      { name: '不屈', source: '周泰', desc: '锁定技，当你处于濒死状态时，将牌堆顶的一张牌置于你的武将牌上，称为“创”。若此牌点数与已有的“创”均不相同，则你将体力回复至1点，否则你将此“创”置入弃牌堆（若你的武将牌上有“创”，你的手牌上限为“创”数）。' },
      { name: '奋激', source: '周泰', desc: '当一名角色被另一名角色弃置或获得而失去手牌后，你可以失去1点体力，令该角色摸两张牌。' },
      { name: '天义', source: '太史慈', desc: '出牌阶段限一次，你可以与一名角色拼点，然后你本阶段根据拼点结果获得对应效果：若你赢，则你使用【杀】的次数上限+1、使用【杀】无距离限制、使用【杀】的目标数上限+1，否则你不能使用【杀】。' },
      { name: '英魂', source: '孙坚', desc: '准备阶段，若你已受伤，你可以选择一名其他角色并选择一项令其执行之：1.摸X张牌并弃置一张牌；2.摸一张牌并弃置X张牌（X为你已损失的体力值）。' },
      { name: '激昂', source: '孙策', desc: '当你使用【决斗】或红色【杀】指定目标后，或成为【决斗】或红色【杀】的目标后，你可以摸一张牌。' },
      { name: '绮胄', source: '贺齐', desc: '锁定技，你根据装备区里牌的花色数视为拥有以下技能：1种以上，“马术”；2种以上，“英姿”；3种以上，“短兵”；4种，“奋威”。(短兵:当你使用【杀】时，可以额外选择一名距离为1的角色为目标。奋威:限定技，当一张锦囊牌指定至少两个目标后，你可以令此牌对其中任意名目标角色无效。)' },
      { name: '闪袭', source: '贺齐', desc: '出牌阶段限一次，你可以弃置一张红色基本牌，选择你攻击范围内的一名其他角色的一张牌，令其弃置之。若其弃置的牌为【闪】，则你观看其手牌，否则其观看你的手牌。' },
      { name: '勤国', source: '吕岱', desc: '当你于回合内使用装备牌结算结束后，你可以视为使用一张无次数限制的【杀】。当你的装备区里的牌数变化后，若变化后的数量等于你的体力值，你回复1点体力。' },

let currentTurnSkills = [];
let allTimeSkills    = [];
let historyRecords   = [];

const $  = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const resultArea        = $('#resultArea');
const currentSkillsArea = $('#currentSkillsArea');
const historyArea       = $('#historyArea');
const skillCountEl      = $('#skillCount');
const toast             = $('#toast');
const btnDraw           = $('#btnDraw');
const btnEndTurn        = $('#btnEndTurn');
const btnMingding       = $('#btnMingding');
const mingdingOverlay   = $('#mingdingOverlay');
const mingdingCards     = $('#mingdingCards');

let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function showResult(html) {
  resultArea.innerHTML = html;
  resultArea.classList.remove('hidden');
}
function hideResult() {
  resultArea.innerHTML = '';
  resultArea.classList.add('hidden');
}

function getPool(faction, hp) {
  const pool = (SKILL_POOL[faction] && SKILL_POOL[faction][hp]) || [];
  return pool.filter(s => !currentTurnSkills.some(c => c.name === s.name));
}

function drawRandom(pool, n) {
  const unique = [];
  const seen = new Set();
  pool.forEach(s => {
    if (!seen.has(s.name)) {
      seen.add(s.name);
      unique.push(s);
    }
  });
  const shuffled = unique.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, Math.min(n, shuffled.length));
}

function updateSkillCount() {
  skillCountEl.textContent = currentTurnSkills.length;
}

function renderOptions(options) {
  if (!options || options.length === 0) {
    hideResult();
    showToast('该势力与体力组合下没有可获得的技能');
    return;
  }
  currentOptions = options;
  showResult(`
    <div class="card-pool">
      ${options.map((s, i) => `
        <div class="skill-card" data-index="${i}">
          <div class="badge">${i + 1}</div>
          <div class="skill-name">${s.name}</div>
          <div class="skill-source">${s.source}</div>
          <div class="skill-desc">${s.desc}</div>
        </div>
      `).join('')}
    </div>
  `);
  $$('.skill-card[data-index]').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.index, 10);
      selectSkill(idx);
    });
  });
}

function selectSkill(index) {
  const skill = currentOptions[index];
  if (!skill) return;

  $$('.skill-card[data-index]').forEach((c, i) => {
    c.classList.toggle('selected', i === index);
  });

  setTimeout(() => {
    currentTurnSkills.push(skill);
    allTimeSkills.push(skill);
    renderCurrentTurnSkills();
    updateSkillCount();
    currentOptions = [];
    hideResult();
    if (currentTurnSkills.length >= 3) {
      showToast('本回合已获得三个技能，相谶改为摸一张牌');
    } else {
      showToast(`获得「${skill.name}」`);
    }
  }, 280);
}

function renderCurrentTurnSkills() {
  if (currentTurnSkills.length === 0) {
    currentSkillsArea.innerHTML = '<div class="empty-hint">暂无</div>';
    return;
  }
  currentSkillsArea.innerHTML = currentTurnSkills.map(s => `
    <div class="skill-card static">
      <div class="skill-name">${s.name}</div>
      <div class="skill-source">${s.source}</div>
      <div class="skill-desc">${s.desc}</div>
    </div>
  `).join('');
}

function renderHistory() {
  if (historyRecords.length === 0) {
    historyArea.innerHTML = '<span class="empty">无</span>';
    return;
  }
  historyArea.innerHTML = historyRecords.map(h =>
    `<span class="tag">${h.name} · ${h.source}</span>`
  ).join('');
}

function activateXiangChen() {
  if (currentTurnSkills.length >= 3) {
    showToast('本回合已获得三个技能，相谶改为摸一张牌');
    return;
  }
  const pool = getPool(currentFaction, currentHp);
  if (pool.length === 0) {
    showToast('该势力与体力组合下已无可用技能');
    return;
  }
  const options = drawRandom(pool, 3);
  renderOptions(options);
  showToast(`从「${currentFaction} · ${currentHp}体力」中随机出现 ${options.length} 个技能`);
}

function endTurn() {
  if (currentTurnSkills.length === 0) {
    showToast('本回合未获得技能，回合结束');
  } else {
    currentTurnSkills.forEach(s => {
      if (!historyRecords.some(h => h.name === s.name)) {
        historyRecords.push({ name: s.name, source: s.source });
      }
    });
    showToast('回合结束，以此法获得的技能已失去');
  }
  currentTurnSkills = [];
  currentOptions = [];
  renderCurrentTurnSkills();
  renderHistory();
  updateSkillCount();
  hideResult();
}

function closeMingding() {
  mingdingOverlay.classList.remove('show');
}

function activateMingding() {
  if (allTimeSkills.length === 0) {
    showToast('暂无历史技能可供命定抽取');
    return;
  }

  mingdingCards.innerHTML = `
    <div class="mingding-confirm">
      <div class="confirm-text">确定要发动「命定」吗？</div>
      <div class="confirm-btns">
        <button class="btn gold" id="btnMingdingConfirm">确 定</button>
        <button class="btn secondary" id="btnMingdingCancel">取 消</button>
      </div>
    </div>
  `;
  mingdingOverlay.classList.add('show');

  const confirmBtn = $('#btnMingdingConfirm');
  confirmBtn.addEventListener('click', () => {
    const result = drawRandom(allTimeSkills, 3);
    const uniqueCount = new Set(allTimeSkills.map(s => s.name)).size;
    mingdingCards.innerHTML = result.map(s => `
      <div class="skill-card static">
        <div class="skill-name">${s.name}</div>
        <div class="skill-source">${s.source}</div>
        <div class="skill-desc">${s.desc}</div>
      </div>
    `).join('');
    showToast(`命定：从 ${uniqueCount} 个历史技能中抽取 ${result.length} 个`);
  });

  const cancelBtn = $('#btnMingdingCancel');
  cancelBtn.addEventListener('click', () => {
    closeMingding();
  });
}

btnDraw.addEventListener('click', activateXiangChen);
btnEndTurn.addEventListener('click', endTurn);
btnMingding.addEventListener('click', activateMingding);

$$('#factionGroup .toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('#factionGroup .toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFaction = btn.dataset.value;
    hideResult();
  });
});

$$('#hpGroup .toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('#hpGroup .toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentHp = parseInt(btn.dataset.value, 10);
    hideResult();
  });
});

renderCurrentTurnSkills();
renderHistory();
updateSkillCount();
hideResult();
</script>
</body>
</html>
