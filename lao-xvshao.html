<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>许劭技能抽取</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e6e6e6;
            min-height: 100vh;
            padding: 20px 15px 80px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }
        
        h1 {
            font-size: 28px;
            color: #ffcc00;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .phase-selector {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .phase-btn {
            background: linear-gradient(to right, #2d4059, #1b2a4a);
            border: none;
            border-radius: 15px;
            padding: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .phase-btn:hover, .phase-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .phase-btn:nth-child(1) {
            border-left: 5px solid #ff6b6b;
        }
        
        .phase-btn:nth-child(2) {
            border-left: 5px solid #4ecdc4;
        }
        
        .phase-btn:nth-child(3) {
            border-left: 5px solid #ffd166;
        }
        
        .skill-count {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 16px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: linear-gradient(145deg, #2d4059, #1b2a4a);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(30px);
            transition: transform 0.4s ease;
        }
        
        .modal-overlay.active .modal {
            transform: translateY(0);
        }
        
        .modal-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-title {
            font-size: 22px;
            color: #ffcc00;
        }
        
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: 60vh;
        }
        
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .skill-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            min-width: 120px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        
        .skill-item:hover, .skill-item:active {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffcc00;
        }
        
        .skill-name {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 5px;
        }
        
        .skill-desc {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .skill-desc.active {
            display: block;
        }
        
        .skill-desc-title {
            font-size: 18px;
            color: #ffcc00;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .skill-desc-content {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        .modal-footer {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
        }
        
        .btn-confirm {
            background: linear-gradient(to right, #4CAF50, #45a049);
            color: white;
        }
        
        .btn-cancel {
            background: linear-gradient(to right, #f44336, #d32f2f);
            color: white;
        }
        
        .btn-close {
            background: linear-gradient(to right, #607D8B, #455A64);
            color: white;
        }
        
        .btn:hover, .btn:active {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }
        
        .empty-message {
            text-align: center;
            padding: 40px 20px;
            font-size: 18px;
            color: #aaa;
        }
        
        .reset-btn {
            display: block;
            margin: 30px auto 0;
            padding: 15px 30px;
            background: linear-gradient(to right, #9C27B0, #7B1FA2);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .reset-btn:hover, .reset-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: all 0.3s ease;
        }
        
        .add-btn:hover, .add-btn:active {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        
        .add-skill-form {
            background: rgba(0, 0, 0, 0.9);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            display: none;
        }
        
        .add-skill-form.active {
            display: block;
        }
        
        .form-title {
            font-size: 20px;
            color: #ff9800;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #555;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }
        
        .form-textarea {
            height: 120px;
            resize: vertical;
        }
        
        .form-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
        
        .btn-save {
            background: linear-gradient(to right, #4CAF50, #45a049);
            color: white;
        }
        
        .btn-cancel-form {
            background: linear-gradient(to right, #f44336, #d32f2f);
            color: white;
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }
            
            .phase-btn {
                padding: 18px;
                font-size: 18px;
            }
            
            .skill-item {
                min-width: 100px;
                padding: 12px;
            }
            
            .skill-name {
                font-size: 20px;
            }
            
            .btn {
                min-width: 100px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>许劭技能抽取</h1>
            <div class="subtitle">点击阶段按钮，从对应池子中抽取技能</div>
        </header>
        
        <div class="phase-selector">
            <div class="phase-btn" data-phase="出牌阶段">
                出牌阶段
                <div class="skill-count" id="count-play">45</div>
            </div>
            <div class="phase-btn" data-phase="结束阶段">
                结束阶段
                <div class="skill-count" id="count-end">12</div>
            </div>
            <div class="phase-btn" data-phase="受到伤害">
                受到伤害
                <div class="skill-count" id="count-damage">25</div>
            </div>
        </div>
        
        <button class="reset-btn" id="resetBtn">
            <i class="fas fa-redo-alt"></i> 重置所有技能
        </button>
    </div>
    
    <!-- 技能选择弹窗 -->
    <div class="modal-overlay" id="skillModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">出牌阶段技能</div>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 技能列表和描述将通过JavaScript动态生成 -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-close" id="closeModal">关闭</button>
            </div>
        </div>
    </div>
    
    <!-- 添加技能按钮 -->
    <button class="add-btn" id="addSkillBtn">
        <i class="fas fa-plus"></i>
    </button>
    
    <!-- 添加技能表单 -->
    <div class="modal-overlay" id="addSkillModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">添加新技能</div>
            </div>
            <div class="modal-body">
                <div class="add-skill-form" id="addSkillForm">
                    <div class="form-group">
                        <label class="form-label" for="skillPhase">选择阶段</label>
                        <select class="form-select" id="skillPhase">
                            <option value="出牌阶段">出牌阶段</option>
                            <option value="结束阶段">结束阶段</option>
                            <option value="受到伤害">受到伤害</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="skillName">技能名称（2字，例如：慰勉）</label>
                        <input type="text" class="form-input" id="skillName" maxlength="2" placeholder="例如：慰勉">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="skillDescription">技能描述</label>
                        <textarea class="form-textarea" id="skillDescription" placeholder="请输入技能描述..."></textarea>
                    </div>
                    
                    <div class="form-buttons">
                        <button class="btn btn-save" id="saveSkillBtn">保存技能</button>
                        <button class="btn btn-cancel-form" id="cancelAddSkillBtn">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 从Excel数据中提取技能信息
        const skillsData = {
            "出牌阶段": [
                {name: "枭噬", description: "出牌阶段限一次，你使用的牌可以额外指定一个目标（无距离限制），若此牌未造成伤害，你失去1点体力或令其中一个目标摸X张牌（X为你上次“矜名”选择的选项序号数）。"},
                {name: "谮构", description: "出牌阶段限一次，你可以观看一名其他角色的手牌，然后选择一项：1.视为使用两张其手牌中没有的基本牌名的牌（不计入次数且无次数限制）；2.你与其依次将手牌中共有牌名的牌替换为牌堆中的等量张【杀】（这些【杀】不计入手牌上限，直至各自的下个结束阶段）。若如此做，其获得你指定基本牌名的“诬”（若其已有则重新指定牌名）。拥有“诬”的角色每回合使用的第一张牌结算结束后，若此牌与其“诬”牌名相同，其失去1点体力并弃其“诬”。"},
                {name: "孤厉", description: "出牌阶段限一次，你可以将所有手牌当做一张无视防具的【杀】使用。此牌结算结束后，若此牌造成过伤害，你可以失去1点体力然后将手牌摸至X张（X为你的体力上限）。"},
                {name: "翦灭", description: "出牌阶段限一次，你可与一名其他角色同时选择一种颜色，你与其弃置各自选择颜色的手牌，然后弃置牌较多的角色视为对另一名角色使用一张【决斗】。"},
                {name: "观骨", description: "转换技，出牌阶段限一次，①你可以观看牌堆顶至多四张牌；②你可以观看一名角色至多四张手牌。然后你可以使用其中一张牌。"},
                {name: "挑衅", description: "出牌阶段限一次，你可以选择一名你在其攻击范围内的角色，然后除非该角色对你使用一张【杀】且此【杀】对你造成伤害，否则你弃置其一张牌并在本阶段内将此技能修改为“出牌阶段限两次”。"},
                {name: "清议", description: "出牌阶段限一次，你可以与至多两名其他有牌的角色同时弃置一张牌，若这些牌的类别均相同，你可以重复此流程。结束阶段，你可以获得其中两种颜色的牌各一张。"},
                {name: "敢决", description: "出牌阶段限一次，你可以将一张装备区里的牌当不计入次数且无距离与次数限制的普通【杀】使用，若目标角色没有与此【杀】花色相同的手牌，其不可响应此【杀】。"},
                {name: "平端", description: "出牌阶段限一次，你可以令一名角色依次执行至不执行：1.使用一张基本牌；2.重铸一张锦囊牌；3.选择其装备区里的一张牌令你获得。其每执行一项便摸一张牌。"},
                {name: "急御", description: "出牌阶段限一次，你可以弃置一张手牌，随机从牌堆或弃牌堆中获得此牌类型外的牌各一张。每阶段限两次，若你于此阶段使用了所有因此获得的牌，该技能可以再次发动。"},
                {name: "缮甲", description: "出牌阶段限一次，你可以摸三张牌，然后可以使用一张【杀】；若如此做：当你此阶段使用下X张手牌时（X为“损”数），你弃置一张牌；此阶段结束时，若你此阶段未以此法弃置基本牌或锦囊牌，你可以视为使用一张无距离限制的【杀】。"},
                {name: "酣战", description: "出牌阶段限一次，你可以选择一名其他角色，你与其依次摸牌至X张（X为各自体力上限且至多摸三张），然后视为你对其使用一张【决斗】。"},
                {name: "据守", description: "出牌阶段限一次，若你的武将牌正面朝上，你可以翻面并弃置至多两张牌，然后获得等量的护甲。当你翻至正面时，你摸X张牌（X为你的护甲值）。当你受到伤害后，若你的武将牌背面朝上，你可以选择一项：1.翻至正面；2.获得1点护甲。"},
                {name: "解烦", description: "出牌阶段限一次，你可以选择一名角色，令其选择一项：1.令攻击范围内含有其的角色各弃置一张牌；2.摸等同于攻击范围内含有其的角色数的牌；背水：此技能失效直至你杀死一名角色。"},
                {name: "颂蜀", description: "出牌阶段限一次，你可以与一名角色拼点，若你：赢，此技能视为未发动过；没赢，你与其各摸两张牌。"},
                {name: "慰勉", description: "出牌阶段限一次，你可以废除至多三个装备栏，令一名角色选择至多等量项：1.恢复一个装备栏；2.回复1点体力；3.弃置所有手牌并摸四张牌（不足全弃，无牌跳过）。"},
                {name: "助国", description: "出牌阶段限一次，你可以令一名角色将手牌数调整至X张（X为其体力上限且至多为5），然后：1.若其没有摸牌，则其回复1点体力；2.若其手牌数全场最多，你可以令其选择是否对你指定的另一名角色使用一张无距离次数限制的【杀】。"},
                {name: "慧识", description: "出牌阶段限一次，若你体力上限小于10，你可进行一次判定：若判定结果与本阶段内以此法进行判定的判定结果花色均不相同，且此时你体力上限小于10，你可以重复此判定并增加1点体力上限。然后你可以将所有生效的判定牌交给任意一名角色。然后若其手牌数为全场最多，你减少1点体力上限。"},
                {name: "狂狷", description: "出牌阶段限X次（X为你的体力上限），你可以将手牌调整至与一名其他角色相同，然后摸弃置牌数张牌。你使用本回合以此法获得的牌无次数限制。"},
                {name: "危盟", description: "出牌阶段限一次，你可以获得一名其他角色的至多X张手牌（X为你的体力值），交给其等量的牌。若你给出的牌点数之和大于/小于获得的牌，你摸一张牌/弃置其区域内的一张牌。"},
                {name: "善刀", description: "出牌阶段限一次，你可将任意名角色的各一张牌置于牌堆顶，视为对这些角色使用一张【五谷丰登】，然后视为对剩余的其他角色使用一张【万箭齐发】。"},
                {name: "英霸", description: "出牌阶段限一次，你可以选择一名体力上限大于1的其他角色，令其减1点体力上限并获得1枚“平定”，然后你减1点体力上限。你对有“平定”的角色使用牌无距离限制。"},
                {name: "火计", description: "出牌阶段限一次，你可以选择一名其他角色，对其以及其同势力角色造成1点火焰伤害。"},
                {name: "除害", description: "使命技，出牌阶段限一次，你可以摸一张牌，并与一名其他角色拼点，此次你的拼点牌点数+X（X为4-你装备区里的牌数）。若你赢：你观看其手牌，从牌堆或弃牌堆中随机获得其手牌中拥有的类别的牌各一张；当你于此阶段对其造成伤害后，将牌堆或弃牌堆中随机一张装备牌置入你对应的空置装备栏。"},
                {name: "温仁", description: "出牌阶段限一次，你可以选择任意名角色，其每满足一项便摸一张牌：1.没有手牌；2.手牌数不大于你。"},
                {name: "易城", description: "出牌阶段限一次，你可以亮出牌堆顶X张牌（X为你的体力上限），然后你可以用任意张手牌交换其中等量张牌。若交换后亮出的牌点数之和未因此增加，则你将交换后亮出的牌以原顺序置于牌堆顶，否则你可以改为将所有手牌以任意顺序置于牌堆顶并获得交换后亮出的牌。"},

        // 初始化技能池（深拷贝，避免修改原数据）
        let skillPools = JSON.parse(JSON.stringify(skillsData));
        let selectedPhase = "";
        let selectedSkill = null;
        
        // DOM元素
        const phaseBtns = document.querySelectorAll('.phase-btn');
        const skillModal = document.getElementById('skillModal');
        const addSkillModal = document.getElementById('addSkillModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalFooter = document.getElementById('modalFooter');
        const closeModalBtn = document.getElementById('closeModal');
        const resetBtn = document.getElementById('resetBtn');
        const addSkillBtn = document.getElementById('addSkillBtn');
        const cancelAddSkillBtn = document.getElementById('cancelAddSkillBtn');
        const saveSkillBtn = document.getElementById('saveSkillBtn');
        
        // 更新技能数量显示
        function updateSkillCounts() {
            document.getElementById('count-play').textContent = skillPools["出牌阶段"].length;
            document.getElementById('count-end').textContent = skillPools["结束阶段"].length;
            document.getElementById('count-damage').textContent = skillPools["受到伤害"].length;
        }
        
        // 从技能池中随机选择3个技能
        function getRandomSkills(phase) {
            const pool = skillPools[phase];
            if (pool.length === 0) return [];
            
            // 如果技能数量不足3个，返回全部
            if (pool.length <= 3) return [...pool];
            
            // 随机选择3个不重复的技能
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 3);
        }
        
        // 显示技能选择弹窗
        function showSkillModal(phase) {
            selectedPhase = phase;
            modalTitle.textContent = `${phase}技能`;
            
            const skills = getRandomSkills(phase);
            
            // 清空弹窗内容
            modalBody.innerHTML = "";
            
            if (skills.length === 0) {
                // 没有技能可抽取
                modalBody.innerHTML = '<div class="empty-message">对应时点无技能</div>';
                modalFooter.innerHTML = '<button class="btn btn-close" id="closeModal">关闭</button>';
            } else {
                // 创建技能列表
                const skillsList = document.createElement('div');
                skillsList.className = 'skills-list';
                
                skills.forEach((skill, index) => {
                    const skillItem = document.createElement('div');
                    skillItem.className = 'skill-item';
                    skillItem.dataset.index = index;
                    
                    skillItem.innerHTML = `
                        <div class="skill-name">${skill.name}</div>
                        <div style="font-size: 14px; color: #aaa;">点击查看详情</div>
                    `;
                    
                    skillItem.addEventListener('click', () => showSkillDescription(skill, skillsList));
                    skillsList.appendChild(skillItem);
                });
                
                modalBody.appendChild(skillsList);
                
                // 初始为空描述区域
                const descArea = document.createElement('div');
                descArea.className = 'skill-desc';
                descArea.id = 'skillDesc';
                modalBody.appendChild(descArea);
                
                // 设置弹窗底部按钮
                modalFooter.innerHTML = '<button class="btn btn-close" id="closeModal">关闭</button>';
            }
            
            // 显示弹窗
            skillModal.classList.add('active');
            
            // 重新绑定关闭按钮事件
            document.getElementById('closeModal').addEventListener('click', () => {
                skillModal.classList.remove('active');
            });
        }
        
        // 显示技能描述
        function showSkillDescription(skill, skillsList) {
            selectedSkill = skill;
            
            // 隐藏所有技能项的高亮
            document.querySelectorAll('.skill-item').forEach(item => {
                item.style.borderColor = 'transparent';
                item.style.background = 'rgba(255, 255, 255, 0.1)';
            });
            
            // 高亮当前选中的技能
            const selectedItem = [...document.querySelectorAll('.skill-item')].find(item => {
                const nameDiv = item.querySelector('.skill-name');
                return nameDiv && nameDiv.textContent === skill.name;
            });
            
            if (selectedItem) {
                selectedItem.style.borderColor = '#ffcc00';
                selectedItem.style.background = 'rgba(255, 204, 0, 0.1)';
            }
            
            // 显示技能描述
            const descArea = document.getElementById('skillDesc');
            descArea.innerHTML = `
                <div class="skill-desc-title">${skill.name}</div>
                <div class="skill-desc-content">${skill.description}</div>
            `;
            descArea.classList.add('active');
            
            // 更新弹窗底部按钮
            modalFooter.innerHTML = `
                <button class="btn btn-cancel" id="cancelSelect">取消</button>
                <button class="btn btn-confirm" id="confirmSelect">确定</button>
                <button class="btn btn-close" id="closeModal">关闭</button>
            `;
            
            // 绑定确定按钮事件
            document.getElementById('confirmSelect').addEventListener('click', () => {
                removeSkillFromPool(selectedPhase, skill);
                skillModal.classList.remove('active');
                updateSkillCounts();
                alert(`已移除技能【${skill.name}】`);
            });
            
            // 绑定取消按钮事件
            document.getElementById('cancelSelect').addEventListener('click', () => {
                descArea.classList.remove('active');
                modalFooter.innerHTML = '<button class="btn btn-close" id="closeModal">关闭</button>';
                // 重新绑定关闭按钮事件
                document.getElementById('closeModal').addEventListener('click', () => {
                    skillModal.classList.remove('active');
                });
                
                // 移除高亮
                if (selectedItem) {
                    selectedItem.style.borderColor = 'transparent';
                    selectedItem.style.background = 'rgba(255, 255, 255, 0.1)';
                }
            });
            
            // 重新绑定关闭按钮事件
            document.getElementById('closeModal').addEventListener('click', () => {
                skillModal.classList.remove('active');
            });
        }
        
        // 从技能池中移除技能
        function removeSkillFromPool(phase, skill) {
            const pool = skillPools[phase];
            const index = pool.findIndex(s => s.name === skill.name);
            if (index !== -1) {
                pool.splice(index, 1);
            }
        }
        
        // 重置所有技能池
        function resetAllSkills() {
            if (confirm("确定要重置所有技能吗？这将恢复所有已移除的技能。")) {
                skillPools = JSON.parse(JSON.stringify(skillsData));
                updateSkillCounts();
                alert("所有技能已重置！");
            }
        }
        
        // 显示添加技能表单
        function showAddSkillForm() {
            addSkillModal.classList.add('active');
        }
        
        // 隐藏添加技能表单
        function hideAddSkillForm() {
            addSkillModal.classList.remove('active');
            // 清空表单
            document.getElementById('skillName').value = '';
            document.getElementById('skillDescription').value = '';
        }
        
        // 保存新技能
        function saveNewSkill() {
            const phase = document.getElementById('skillPhase').value;
            const name = document.getElementById('skillName').value.trim();
            const description = document.getElementById('skillDescription').value.trim();
            
            // 验证输入
            if (!name) {
                alert("请输入技能名称！");
                return;
            }
            
            if (name.length !== 2) {
                alert("技能名称必须为2个字！");
                return;
            }
            
            if (!description) {
                alert("请输入技能描述！");
                return;
            }
            
            // 检查是否已存在同名技能
            const existingSkill = skillPools[phase].find(skill => skill.name === name);
            if (existingSkill) {
                alert("该阶段已存在同名技能！");
                return;
            }
            
            // 添加到技能池
            skillPools[phase].push({name, description});
            updateSkillCounts();
            
            // 同时更新原始数据，以便重置时也能保留
            if (!skillsData[phase].some(skill => skill.name === name)) {
                skillsData[phase].push({name, description});
            }
            
            alert(`成功添加技能【${name}】到${phase}池中！`);
            hideAddSkillForm();
        }
        
        // 初始化事件监听
        function initEventListeners() {
            // 阶段按钮点击事件
            phaseBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const phase = btn.dataset.phase;
                    showSkillModal(phase);
                });
            });
            
            // 重置按钮
            resetBtn.addEventListener('click', resetAllSkills);
            
            // 添加技能按钮
            addSkillBtn.addEventListener('click', showAddSkillForm);
            
            // 取消添加技能
            cancelAddSkillBtn.addEventListener('click', hideAddSkillForm);
            
            // 保存新技能
            saveSkillBtn.addEventListener('click', saveNewSkill);
            
            // 点击弹窗外部关闭弹窗
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.classList.remove('active');
                    }
                });
            });
        }
        
        // 初始化应用
        function initApp() {
            updateSkillCounts();
            initEventListeners();
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
