<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>裴秀 · 十六州</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #1a1410;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 12px;
        }

        .game-container {
            background: #2d231e;
            padding: 24px 20px 28px;
            border-radius: 40px 40px 28px 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 #5a443a;
            border: 1px solid #4f3b30;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .title {
            color: #e8d5b8;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 2px 0 #0f0b09;
        }
        .title small {
            font-size: 12px;
            letter-spacing: 1px;
            color: #b3977a;
            margin-left: 6px;
        }

        .status-badges {
            display: flex;
            gap: 8px;
            font-size: 12px;
            color: #b3977a;
            flex-wrap: wrap;
        }
        .status-badges span {
            background: #1e1713;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #3f2e24;
            font-size: 12px;
        }
        .status-badges .highlight {
            color: #f5d97a;
            border-color: #c99a4a;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #3d2e26;
            padding: 8px;
            border-radius: 20px;
            box-shadow: inset 0 4px 12px #0f0b09;
            aspect-ratio: 1 / 1;
        }

        .cell {
            background: #1e1713;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #f0e0cc;
            transition: background 0.15s;
            box-shadow: inset 0 -2px 0 #3f2e24;
            position: relative;
            aspect-ratio: 1 / 1;
            padding: 2px;
            min-height: 0;
        }

        .cell.empty {
            background: transparent;
            box-shadow: none;
        }

        .cell.floor {
            background: #5a4032;
            background-image: radial-gradient(circle at 30% 25%, #7a5c48 1px, transparent 1px),
                radial-gradient(circle at 70% 75%, #7a5c48 1px, transparent 1px);
            background-size: 30px 30px;
            box-shadow: inset 0 -3px 0 #3d2b1f, 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .cell.start {
            background: #5f7a4a;
            background-image: radial-gradient(circle at 30% 25%, #8bb36a 1px, transparent 1px),
                radial-gradient(circle at 70% 75%, #8bb36a 1px, transparent 1px);
            box-shadow: inset 0 -3px 0 #3d5a2a, 0 0 16px #7fb35a80;
        }

        .cell.player {
            background: #c99a4a;
            background-image: radial-gradient(circle at 30% 25%, #f5d97a 1px, transparent 1px),
                radial-gradient(circle at 70% 75%, #f5d97a 1px, transparent 1px);
            box-shadow: inset 0 -3px 0 #9e732a, 0 0 24px #f5c542aa;
            transform: scale(1.02);
            z-index: 2;
        }

        .cell-main {
            font-size: clamp(16px, 3.5vw, 26px);
            line-height: 1.1;
            text-align: center;
            z-index: 1;
            pointer-events: none;
        }
        .cell-name {
            font-size: clamp(7px, 1.3vw, 11px);
            color: #b8d9a0;
            opacity: 0.9;
            position: absolute;
            bottom: 2px;
            left: 3px;
            pointer-events: none;
            line-height: 1.1;
            font-weight: 400;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        .cell-sub {
            font-size: clamp(8px, 1.5vw, 13px);
            color: #f5d97a;
            position: absolute;
            bottom: 2px;
            right: 3px;
            pointer-events: none;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        .cell-player .cell-main {
            font-size: clamp(20px, 4vw, 34px);
            color: #2d1f14;
            text-shadow: 0 0 12px #ffe28a;
        }
        .cell-start .cell-main {
            color: #f6ffd0;
        }

        .cell.triggered {
            opacity: 0.5;
            filter: grayscale(0.6);
        }
        .cell.triggered .cell-main,
        .cell.triggered .cell-name,
        .cell.triggered .cell-sub {
            opacity: 0.6;
        }

        /* ===== 方向键 - 菱形十字布局（左右留空） ===== */
        .controls {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .controls-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        /* 左右行：左按钮 + 空白占位 + 右按钮 */
        .controls-row-center {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        /* 空白占位，宽度与按钮相同，透明不可点击 */
        .controls-spacer {
            width: 62px;
            height: 62px;
            flex-shrink: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 40% 35%, #5f483a, #2a1e18);
            box-shadow: 0 5px 0 #110d0a, 0 8px 16px rgba(0, 0, 0, 0.6);
            color: #f0e0cc;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.06s linear;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #110d0a, 0 8px 16px rgba(0, 0, 0, 0.6);
        }
        .btn .suit {
            font-size: 32px;
            line-height: 1;
        }

        /* 花色颜色 - 扑克牌标准 */
        .suit-heart { color: #e74c3c; }
        .suit-diamond { color: #e74c3c; }  /* 方块统一红色 */
        .suit-club { color: #1a1a1a; }
        .suit-spade { color: #1a1a1a; }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            gap: 6px;
            flex-wrap: wrap;
        }
        .step-display {
            color: #b3977a;
            font-size: 13px;
            padding: 4px 12px;
            background: #1e1713;
            border-radius: 20px;
            border: 1px solid #3f2e24;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-action {
            background: #8a5a3a;
            border: none;
            color: #f6edd0;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 0 #5a3a24, 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: 0.06s linear;
            letter-spacing: 1px;
        }
        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #5a3a24, 0 4px 12px rgba(0, 0, 0, 0.4);
        }
        .btn-action:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5a3a24;
            cursor: not-allowed;
        }
        .btn-action.secondary {
            background: #3a2a20;
            box-shadow: 0 4px 0 #1f140e;
        }
        .btn-action.secondary:active {
            box-shadow: 0 1px 0 #1f140e;
        }
        .btn-action.back {
            background: #3a4a5a;
            box-shadow: 0 4px 0 #1a2a3a;
        }
        .btn-action.back:active {
            box-shadow: 0 1px 0 #1a2a3a;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #2d231e;
            border: 2px solid #5a443a;
            border-radius: 28px;
            padding: 28px 24px 24px;
            max-width: 420px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.9);
        }
        .modal-title {
            color: #e8d5b8;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        .modal-body {
            color: #d4c0a8;
            font-size: 15px;
            line-height: 1.7;
        }
        .modal-body .skill-item {
            background: #1e1713;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #c99a4a;
        }
        .modal-body .skill-item .skill-name {
            color: #f5d97a;
            font-weight: 600;
            font-size: 15px;
        }
        .modal-body .skill-item .skill-desc {
            color: #c4b09a;
            font-size: 14px;
            margin-top: 2px;
        }
        .modal-body .skill-item.bonus {
            border-left-color: #f5c542;
            background: #2a1f18;
        }
        .modal-body .draw-result {
            text-align: center;
            padding: 8px 0;
        }
        .modal-body .draw-result .count {
            font-size: 28px;
            color: #f5d97a;
            font-weight: 700;
        }
        .modal-body .draw-result .hint {
            font-size: 13px;
            color: #8a7a6a;
            margin-top: 4px;
        }
        .modal-body .center-text {
            text-align: center;
            padding: 12px 0;
            font-size: 18px;
            color: #f5d97a;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal-btn {
            background: #5a4032;
            border: none;
            color: #f0e0cc;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 3px 0 #2d1f14;
            transition: 0.06s linear;
            min-width: 80px;
        }
        .modal-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #2d1f14;
        }
        .modal-btn.primary {
            background: #8a6a3a;
            box-shadow: 0 3px 0 #5a4020;
        }

        .modal::-webkit-scrollbar { width: 4px; }
        .modal::-webkit-scrollbar-track { background: #1e1713; border-radius: 10px; }
        .modal::-webkit-scrollbar-thumb { background: #5a443a; border-radius: 10px; }

        @media (max-width: 440px) {
            .game-container { padding: 16px 12px 20px; }
            .grid { gap: 4px; padding: 6px; }
            .btn { width: 52px; height: 52px; font-size: 24px; }
            .btn .suit { font-size: 26px; }
            .controls-spacer { width: 52px; height: 52px; }
            .modal { padding: 20px 16px; }
            .cell-main { font-size: clamp(13px, 3vw, 20px); }
            .cell-name { font-size: clamp(6px, 1.1vw, 9px); }
            .cell-sub { font-size: clamp(7px, 1.2vw, 10px); }
            .btn-action { font-size: 12px; padding: 5px 12px; }
            .title { font-size: 17px; }
            .status-badges span { font-size: 10px; padding: 2px 8px; }
            .controls-row { gap: 8px; }
            .controls-row-center { gap: 8px; }
        }
        @media (max-width: 360px) {
            .grid { gap: 3px; padding: 4px; }
            .btn { width: 44px; height: 44px; font-size: 20px; }
            .btn .suit { font-size: 20px; }
            .controls-spacer { width: 44px; height: 44px; }
            .controls-row { gap: 6px; }
            .controls-row-center { gap: 6px; }
            .cell { border-radius: 8px; }
            .bottom-bar { gap: 4px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="title">裴秀 · 十六州 <small id="mapNameDisplay">?</small></div>
        <div class="status-badges">
            <span id="visitedBadge">🗺 0/0</span>
            <span id="doneBadge">✅ 0/16</span>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <!-- 方向键 - 菱形十字布局（左右之间有空白占位） -->
    <div class="controls">
        <div class="controls-row">
            <button class="btn" id="btnUp"><span class="suit suit-heart">♥</span></button>
        </div>
        <div class="controls-row-center">
            <button class="btn" id="btnLeft"><span class="suit suit-club">♣</span></button>
            <div class="controls-spacer"></div>
            <button class="btn" id="btnRight"><span class="suit suit-spade">♠</span></button>
        </div>
        <div class="controls-row">
            <button class="btn" id="btnDown"><span class="suit suit-diamond">♦</span></button>
        </div>
    </div>

    <div class="bottom-bar">
        <span class="step-display" id="stepDisplay">步数 0</span>
        <div class="btn-group">
            <button class="btn-action" id="btnEnd">⚔ 结束</button>
            <button class="btn-action secondary" id="btnReset">↺ 重开</button>
            <button class="btn-action back" id="btnBack">🏠 回到开始</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent">
        <div class="modal-title" id="modalTitle">提示</div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

    // ============================================================
    //  全局状态
    // ============================================================
    let allMaps = [];
    let availableMapIds = [];
    let currentMap = null;

    let playerRow = 0;
    let playerCol = 0;
    let steps = 0;
    let triggeredNames = new Set();
    let isProcessing = false;
    let isMapCompleted = false;

    let journeySkills = new Set();
    let journeyBonusAdded = false;
    let completedMapIds = new Set();

    const gridEl = document.getElementById('grid');
    const stepDisplay = document.getElementById('stepDisplay');
    const visitedBadge = document.getElementById('visitedBadge');
    const doneBadge = document.getElementById('doneBadge');
    const mapNameDisplay = document.getElementById('mapNameDisplay');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalFooter = document.getElementById('modalFooter');

    // ============================================================
    //  工具
    // ============================================================
    function deepCopy(arr) {
        return arr.map(row => row.map(cell => ({ ...cell })));
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getCell(grid, row, col) {
        if (row < 0 || row > 4 || col < 0 || col > 4) return null;
        return grid[row][col];
    }

    function isWalkable(grid, row, col) {
        if (row < 0 || row > 4 || col < 0 || col > 4) return false;
        const cell = grid[row][col];
        return cell.type === 'floor' || cell.type === 'start' || cell.type === 'special';
    }

    function getAllSkills() {
        const all = {};
        allMaps.forEach(m => {
            if (m.skills) {
                Object.assign(all, m.skills);
            }
        });
        return all;
    }

    // ============================================================
    //  核心行走逻辑
    // ============================================================
    function tryMove(dRow, dCol) {
        if (isProcessing || isMapCompleted) return;
        if (!currentMap) return;

        const grid = currentMap.grid;

        const firstRow = playerRow + dRow;
        const firstCol = playerCol + dCol;
        if (!isWalkable(grid, firstRow, firstCol)) return;

        isProcessing = true;

        // 阶段1：计算完整路径
        let path = [];
        let currentR = playerRow;
        let currentC = playerCol;

        while (true) {
            const nextR = currentR + dRow;
            const nextC = currentC + dCol;
            if (!isWalkable(grid, nextR, nextC)) break;
            currentR = nextR;
            currentC = nextC;
            path.push({ row: currentR, col: currentC });
        }

        if (path.length === 0) {
            isProcessing = false;
            return;
        }

        const endR = currentR;
        const endC = currentC;

        // 阶段2：收集路径上的特殊格
        let specialsOnPath = [];
        for (let p of path) {
            const cell = getCell(grid, p.row, p.col);
            if (cell && cell.type === 'special' && !triggeredNames.has(cell.name)) {
                specialsOnPath.push({
                    row: p.row,
                    col: p.col,
                    cell: cell
                });
            }
        }

        // 阶段3：移动到终点
        playerRow = endR;
        playerCol = endC;
        steps += path.length;
        render();
        updateBadges();

        // 阶段4：依次触发特殊格
        if (specialsOnPath.length === 0) {
            isProcessing = false;
            checkMapCompletion();
            return;
        }

        processSpecialQueue(specialsOnPath, 0);
    }

    // ============================================================
    //  逐个触发特殊格队列
    // ============================================================
    function processSpecialQueue(specials, index) {
        if (!currentMap) {
            isProcessing = false;
            return;
        }

        if (index >= specials.length) {
            isProcessing = false;
            render();
            updateBadges();
            checkMapCompletion();
            return;
        }

        const item = specials[index];
        const cell = item.cell;

        if (triggeredNames.has(cell.name)) {
            processSpecialQueue(specials, index + 1);
            return;
        }

        triggerSpecial(cell, specials, index);
    }

    // ============================================================
    //  触发单个特殊格
    // ============================================================
    function triggerSpecial(cell, specials, index) {
        const name = cell.name;
        const type = cell.specialType;
        const value = cell.value;

        triggeredNames.add(name);
        journeySkills.add(name);
        updateBadges();

        switch (type) {
            case 'up':
            case 'down':
            case 'left':
            case 'right': {
                let dRow = 0, dCol = 0;
                if (type === 'up') dRow = -value;
                else if (type === 'down') dRow = value;
                else if (type === 'left') dCol = -value;
                else if (type === 'right') dCol = value;

                const targetRow = playerRow + dRow;
                const targetCol = playerCol + dCol;

                if (isWalkable(currentMap.grid, targetRow, targetCol)) {
                    playerRow = targetRow;
                    playerCol = targetCol;
                    steps++;
                    render();
                    updateBadges();
                }

                if (checkMapCompletion()) {
                    isProcessing = false;
                    return;
                }

                processSpecialQueue(specials, index + 1);
                break;
            }
            case 'card':
            case 'hp': {
                const msg = type === 'card' ? `摸 ${value} 张牌` : `回 ${value} 点血`;
                showModal(
                    `⚡ ${name}`,
                    `<div style="text-align:center;font-size:22px;padding:12px 0;">${msg}</div>`,
                    [
                        { text: '确认', class: 'primary', action: () => {
                            closeModal();
                            render();
                            updateBadges();
                            if (checkMapCompletion()) {
                                isProcessing = false;
                                return;
                            }
                            processSpecialQueue(specials, index + 1);
                        }}
                    ]
                );
                break;
            }
            default: {
                processSpecialQueue(specials, index + 1);
                break;
            }
        }
    }

    // ============================================================
    //  检查地图完成
    // ============================================================
    function checkMapCompletion() {
        if (!currentMap) return false;
        if (isMapCompleted) return true;

        const allNames = currentMap.specialNames;
        const allVisited = allNames.every(name => triggeredNames.has(name));

        if (allVisited) {
            isMapCompleted = true;
            if (!journeyBonusAdded) {
                journeySkills.add(currentMap.bonusSkill);
                journeyBonusAdded = true;
            }
            completedMapIds.add(currentMap.id);
            const idx = availableMapIds.indexOf(currentMap.id);
            if (idx !== -1) {
                availableMapIds.splice(idx, 1);
            }
            updateBadges();

            showModal(
                `✅ ${currentMap.name} 完成！`,
                `<div style="text-align:center;padding:12px 0;">
                    <p style="font-size:20px;color:#f5d97a;">🎴 将手牌补充至四花色</p>
                    <p style="color:#8a7a6a;font-size:14px;margin-top:8px;">州专属技能已加入本次旅程</p>
                    <p style="color:#8a7a6a;font-size:13px;">剩余地图：${availableMapIds.length} 个</p>
                </div>`,
                [
                    { text: '继续', class: 'primary', action: () => {
                        closeModal();
                        isProcessing = false;
                        if (availableMapIds.length > 0) {
                            pickRandomMap();
                        } else {
                            showModal(
                                '🎉 全部完成！',
                                '<div class="center-text">你已经走完了所有州！<br>太强了！</div>',
                                [{ text: '太棒了', class: 'primary', action: closeModal }]
                            );
                        }
                    }}
                ]
            );
            return true;
        }
        return false;
    }

    // ============================================================
    //  加载 / 随机地图
    // ============================================================
    function loadMap(mapData) {
        currentMap = {
            id: mapData.id,
            name: mapData.name,
            bonusSkill: mapData.bonusSkill,
            specialNames: [...mapData.specialNames],
            grid: deepCopy(mapData.grid),
            startRow: mapData.startRow,
            startCol: mapData.startCol,
            skills: { ...mapData.skills }
        };
        playerRow = currentMap.startRow;
        playerCol = currentMap.startCol;
        steps = 0;
        triggeredNames = new Set();
        isMapCompleted = false;
        isProcessing = false;
        journeyBonusAdded = false;
        render();
        updateBadges();
        mapNameDisplay.textContent = currentMap.name;
    }

    function pickRandomMap() {
        if (availableMapIds.length === 0) {
            showModal(
                '🎉 全部完成！',
                '<div class="center-text">你已经走完了所有州！<br>太强了！</div>',
                [{ text: '太棒了', class: 'primary', action: closeModal }]
            );
            return false;
        }

        const idx = Math.floor(Math.random() * availableMapIds.length);
        const mapId = availableMapIds[idx];
        const mapData = allMaps.find(m => m.id === mapId);
        if (!mapData) {
            availableMapIds.splice(idx, 1);
            return pickRandomMap();
        }
        loadMap(mapData);
        return true;
    }

    // ============================================================
    //  结束
    // ============================================================
    function handleEnd() {
        if (isProcessing) return;
        if (!currentMap) return;

        const pool = Array.from(journeySkills);
        if (pool.length === 0) {
            showModal(
                '📜 本次旅程无技能',
                '<p style="text-align:center;color:#8a7a6a;padding:12px 0;">这次旅程还没有走过任何特殊格子</p>',
                [
                    { text: '继续', class: 'primary', action: () => {
                        closeModal();
                        if (availableMapIds.length > 0) {
                            pickRandomMap();
                        } else {
                            showModal(
                                '🎉 全部完成！',
                                '<div class="center-text">你已经走完了所有州！<br>太强了！</div>',
                                [{ text: '太棒了', class: 'primary', action: closeModal }]
                            );
                        }
                    }}
                ]
            );
            return;
        }

        const allSkills = getAllSkills();
        const shuffled = shuffleArray([...pool]);
        const drawn = shuffled.slice(0, 3);

        let html = `<div class="draw-result">
            <div class="count">🎯 ${drawn.length}</div>
            <div class="hint">从本次旅程的 ${pool.length} 个技能中抽取</div>
        </div>`;

        drawn.forEach(name => {
            const desc = allSkills[name] || '未知技能';
            const isBonus = allMaps.some(m => m.bonusSkill === name);
            html += `
                <div class="skill-item ${isBonus ? 'bonus' : ''}">
                    <div class="skill-name">${name} ${isBonus ? '⭐ 州专属' : ''}</div>
                    <div class="skill-desc">${desc}</div>
                </div>
            `;
        });

        showModal(
            '⚔ 抽取结果',
            html,
            [
                { text: '收下并继续', class: 'primary', action: () => {
                    closeModal();
                    journeySkills = new Set();
                    journeyBonusAdded = false;
                    if (availableMapIds.length > 0) {
                        pickRandomMap();
                    } else {
                        showModal(
                            '🎉 全部完成！',
                            '<div class="center-text">你已经走完了所有州！<br>太强了！</div>',
                            [{ text: '太棒了', class: 'primary', action: closeModal }]
                        );
                    }
                }}
            ]
        );
    }

    // ============================================================
    //  渲染
    // ============================================================
    function render() {
        if (!currentMap) {
            gridEl.innerHTML = '<div style="grid-column:1/6;display:flex;justify-content:center;align-items:center;color:#8a7a6a;">请开始游戏</div>';
            return;
        }

        gridEl.innerHTML = '';
        const grid = currentMap.grid;

        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';

                const data = grid[r][c];
                const isPlayer = (r === playerRow && c === playerCol);

                if (data.type === 'empty') {
                    cell.classList.add('empty');
                } else {
                    cell.classList.add('floor');

                    if (data.type === 'start') {
                        cell.classList.add('start');
                        if (!isPlayer) {
                            const main = document.createElement('span');
                            main.className = 'cell-main';
                            main.textContent = '起';
                            cell.appendChild(main);
                        }
                    }

                    if (data.type === 'special') {
                        const isTriggered = triggeredNames.has(data.name);
                        if (isTriggered) {
                            cell.classList.add('triggered');
                        }
                        const main = document.createElement('span');
                        main.className = 'cell-main';
                        const st = data.specialType;
                        if (st === 'up') main.textContent = '上';
                        else if (st === 'down') main.textContent = '下';
                        else if (st === 'left') main.textContent = '左';
                        else if (st === 'right') main.textContent = '右';
                        else if (st === 'card') main.textContent = '牌';
                        else if (st === 'hp') main.textContent = '血';
                        cell.appendChild(main);

                        const sub = document.createElement('span');
                        sub.className = 'cell-sub';
                        sub.textContent = `-${data.value}`;
                        cell.appendChild(sub);

                        const nameEl = document.createElement('span');
                        nameEl.className = 'cell-name';
                        nameEl.textContent = data.name;
                        cell.appendChild(nameEl);
                    }

                    if (isPlayer) {
                        cell.classList.remove('floor', 'start', 'triggered');
                        cell.classList.add('player');
                        cell.innerHTML = '';
                        const main = document.createElement('span');
                        main.className = 'cell-main';
                        main.textContent = '◆';
                        cell.appendChild(main);
                    }

                    if (isMapCompleted && data.type === 'special') {
                        cell.classList.add('triggered');
                    }
                }

                gridEl.appendChild(cell);
            }
        }

        stepDisplay.textContent = `步数 ${steps}`;
        mapNameDisplay.textContent = currentMap.name || '?';
        updateBadges();
    }

    function updateBadges() {
        const total = currentMap ? currentMap.specialNames.length : 0;
        const visited = triggeredNames.size;
        const doneCount = completedMapIds.size;
        const totalMaps = allMaps.length;
        const journeyCount = journeySkills.size;

        visitedBadge.textContent = `🗺 ${visited}/${total} | 🎴 ${journeyCount}`;
        visitedBadge.className = (visited === total && total > 0) ? 'highlight' : '';
        doneBadge.textContent = `✅ ${doneCount}/${totalMaps}`;
    }

    // ============================================================
    //  对话框
    // ============================================================
    function showModal(title, bodyHTML, buttons) {
        modalTitle.textContent = title;
        modalBody.innerHTML = bodyHTML;
        modalFooter.innerHTML = '';
        buttons.forEach((btn) => {
            const el = document.createElement('button');
            el.className = `modal-btn ${btn.class || ''}`;
            el.textContent = btn.text;
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                if (btn.action) btn.action();
            });
            modalFooter.appendChild(el);
        });
        modalOverlay.classList.add('active');
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
    }

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            const hasPrimary = modalFooter.querySelector('.primary');
            if (!hasPrimary) closeModal();
        }
    });

    // ============================================================
    //  重置
    // ============================================================
    function resetCurrentMap() {
        if (!currentMap) return;
        if (isProcessing) return;
        if (isMapCompleted) {
            showModal(
                '⚠️ 已完成',
                '<p style="text-align:center;color:#8a7a6a;padding:12px 0;">这张地图已经完成，进入下一张吧</p>',
                [{ text: '知道了', class: '', action: closeModal }]
            );
            return;
        }
        playerRow = currentMap.startRow;
        playerCol = currentMap.startCol;
        steps = 0;
        render();
        updateBadges();
    }

    function goBackToStart() {
        if (isProcessing) return;
        closeModal();
        journeySkills = new Set();
        journeyBonusAdded = false;
        completedMapIds = new Set();
        availableMapIds = allMaps.map(m => m.id);
        currentMap = null;
        playerRow = 0;
        playerCol = 0;
        steps = 0;
        triggeredNames = new Set();
        isMapCompleted = false;
        isProcessing = false;

        gridEl.innerHTML = '<div style="grid-column:1/6;display:flex;justify-content:center;align-items:center;color:#8a7a6a;">请开始游戏</div>';
        mapNameDisplay.textContent = '?';
        stepDisplay.textContent = '步数 0';
        updateBadges();

        showModal(
            '🏯 裴秀 · 十六州',
            `<div style="text-align:center;padding:8px 0;">
                <p style="color:#d4c0a8;">探索十六州，收集技能！</p>
                <p style="color:#8a7a6a;font-size:14px;margin-top:6px;">共 ${allMaps.length} 张地图</p>
            </div>`,
            [
                { text: '开始', class: 'primary', action: () => {
                    closeModal();
                    pickRandomMap();
                }}
            ]
        );
    }

    // ============================================================
    //  初始化
    // ============================================================
    function init() {
        allMaps = MAPS_DATA.map(m => ({
            id: m.id,
            name: m.name,
            bonusSkill: m.bonusSkill,
            specialNames: [...m.specialNames],
            grid: deepCopy(m.grid),
            startRow: m.startRow,
            startCol: m.startCol,
            skills: { ...m.skills }
        }));
        availableMapIds = allMaps.map(m => m.id);

        document.getElementById('btnUp').addEventListener('click', () => tryMove(-1, 0));
        document.getElementById('btnDown').addEventListener('click', () => tryMove(1, 0));
        document.getElementById('btnLeft').addEventListener('click', () => tryMove(0, -1));
        document.getElementById('btnRight').addEventListener('click', () => tryMove(0, 1));
        document.getElementById('btnEnd').addEventListener('click', handleEnd);
        document.getElementById('btnReset').addEventListener('click', resetCurrentMap);
        document.getElementById('btnBack').addEventListener('click', goBackToStart);

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 'A', 'a', 's', 'S', 'd', 'D'].includes(key)) {
                e.preventDefault();
            }
            switch (key) {
                case 'ArrowUp': case 'w': case 'W': tryMove(-1, 0); break;
                case 'ArrowDown': case 's': case 'S': tryMove(1, 0); break;
                case 'ArrowLeft': case 'a': case 'A': tryMove(0, -1); break;
                case 'ArrowRight': case 'd': case 'D': tryMove(0, 1); break;
                case 'Enter': if (modalOverlay.classList.contains('active')) {
                    const primary = modalFooter.querySelector('.primary');
                    if (primary) primary.click();
                }; break;
                case 'Escape': closeModal(); break;
            }
        });

        gridEl.innerHTML = '<div style="grid-column:1/6;display:flex;justify-content:center;align-items:center;color:#8a7a6a;">请开始游戏</div>';
        mapNameDisplay.textContent = '?';
        stepDisplay.textContent = '步数 0';
        updateBadges();

        showModal(
            '🏯 裴秀 · 十六州',
            `<div style="text-align:center;padding:8px 0;">
                <p style="color:#d4c0a8;">探索十六州，收集技能！</p>
                <p style="color:#8a7a6a;font-size:14px;margin-top:6px;">共 ${allMaps.length} 张地图</p>
            </div>`,
            [
                { text: '开始', class: 'primary', action: () => {
                    closeModal();
                    pickRandomMap();
                }}
            ]
        );
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
