<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国杀面杀小助手</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        body {
            background: linear-gradient(120deg, #2c3e50, #000000);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px 50px;
        }

        /* ===== 顶部切换栏 ===== */
        .tab-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 45px;
            background: rgba(255, 255, 255, 0.06);
            padding: 10px 20px;
            border-radius: 60px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 2px solid transparent;
            border-radius: 40px;
            padding: 14px 40px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.35s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(52, 152, 219, 0.20);
            border-color: rgba(52, 152, 219, 0.30);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            color: #ffffff;
            background: #3498db;
            border-color: #3498db;
            box-shadow: 0 6px 25px rgba(52, 152, 219, 0.40);
            transform: translateY(-2px);
        }

        .tab-btn.active:hover {
            background: #2e86c1;
            border-color: #2e86c1;
        }

        /* ===== 整体容器 ===== */
        .overall-wrapper {
            width: 100%;
            max-width: 1050px;
            position: relative;
        }

        /* ===== 每个 "整体" 内容 ===== */
        .overall {
            display: none;
            animation: fadeUp 0.45s ease forwards;
        }

        .overall.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(28px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 整体标题 ===== */
        .overall-title {
            color: #ffffff;
            font-size: 2.2rem;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.6);
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
            word-break: break-word;
        }

        .overall-title small {
            font-size: 1rem;
            font-weight: 400;
            opacity: 0.7;
            display: block;
            margin-top: 6px;
            letter-spacing: 0;
        }

        /* ===== 分类组 ===== */
        .group-container {
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 18px 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s;
        }

        .group-container:hover {
            border-color: rgba(52, 152, 219, 0.25);
        }

        .group-title {
            color: #ecf0f1;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 2px;
            padding-left: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /*-- 其他图标在 CSS 中新增 */
        .group-container.version-guo .group-title {
            border-left: 4px solid #95a5a6;   /* 换颜色 */
        }
        .version-guo .jump-button { border-color: #95a5a6; }
        .version-guo .jump-button:hover { background: #95a5a6; border-color: #95a5a6; }

        /* 图例加一个点 */
        .dot-guo { background: #95a5a6; }

        /* 每个版本独特的左侧色条 */
        .group-container.version-mobile .group-title {
            border-left: 4px solid #e67e22;
        }
        .group-container.version-mobile:hover {
            border-color: rgba(230, 126, 34, 0.30);
        }

        .group-container.version-10th .group-title {
            border-left: 4px solid #2ecc71;
        }
        .group-container.version-10th:hover {
            border-color: rgba(46, 204, 113, 0.30);
        }

        .group-container.version-ol .group-title {
            border-left: 4px solid #9b59b6;
        }
        .group-container.version-ol:hover {
            border-color: rgba(155, 89, 182, 0.30);
        }

        /* ===== 按钮容器（flex 换行） ===== */
        .group-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        /* ===== 单个按钮 ===== */
        .jump-button {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            border: 2px solid #3498db;
            border-radius: 12px;
            padding: 14px 22px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.20);
            flex: 0 1 auto;
            min-width: 100px;
            max-width: 170px;
            word-break: break-word;
            line-height: 1.3;
        }

        .jump-button:hover {
            background: #3498db;
            color: #ffffff;
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.40);
            border-color: #5faee3;
        }

        .jump-button:active {
            transform: translateY(-2px) scale(0.97);
        }

        /* 每个版本按钮的 hover 颜色微差（边框颜色保持一致） */
        .version-mobile .jump-button {
            border-color: #e67e22;
        }
        .version-mobile .jump-button:hover {
            background: #e67e22;
            border-color: #e67e22;
        }

        .version-10th .jump-button {
            border-color: #2ecc71;
        }
        .version-10th .jump-button:hover {
            background: #2ecc71;
            border-color: #2ecc71;
        }

        .version-ol .jump-button {
            border-color: #9b59b6;
        }
        .version-ol .jump-button:hover {
            background: #9b59b6;
            border-color: #9b59b6;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .tab-bar {
                gap: 12px;
                padding: 10px 16px;
                max-width: 400px;
                width: 100%;
            }
            .tab-btn {
                padding: 12px 20px;
                font-size: 1rem;
                flex: 1;
                text-align: center;
                min-width: 70px;
            }
            .overall-title {
                font-size: 1.7rem;
            }
            .group-title {
                font-size: 1.1rem;
            }
            .jump-button {
                padding: 12px 16px;
                font-size: 0.9rem;
                min-width: 80px;
                flex: 1 0 auto;
                max-width: 100%;
            }
            .group-container {
                padding: 14px 14px 16px;
            }
        }

        @media (max-width: 480px) {
            .group-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .jump-button {
                max-width: 100%;
                min-height: 50px;
                flex: 1 1 auto;
            }
            .overall-title {
                font-size: 1.4rem;
            }
        }

        /* ===== 页脚 ===== */
        .footer-tip {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 1px;
        }

        /* ===== 辅助说明（标记版本颜色） ===== */
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .legend .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }
        .dot-mobile {
            background: #e67e22;
        }
        .dot-10th {
            background: #2ecc71;
        }
        .dot-ol {
            background: #9b59b6;
        }
        .dot-other  { 
            background: #95a5a6; 
        }
    </style>
</head>

    <!-- ====== JavaScript 切换逻辑 ====== -->
    <script>
        (function() {
            function switchTab(tabId) {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
                });
                document.querySelectorAll('.overall').forEach(overall => {
                    overall.classList.toggle('active', overall.id === tabId);
                });
            }
            window.switchTab = switchTab;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');
                    if (tabId) switchTab(tabId);
                });
            });

            // 默认激活第一个
            const firstActive = document.querySelector('.tab-btn.active');
            if (firstActive) {
                const defaultTab = firstActive.getAttribute('data-tab');
                if (defaultTab) switchTab(defaultTab);
            } else {
                const firstBtn = document.querySelector('.tab-btn');
                if (firstBtn) {
                    const firstTab = firstBtn.getAttribute('data-tab');
                    if (firstTab) switchTab(firstTab);
                }
            }
        })();
    </script>
