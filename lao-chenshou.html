<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陈寿小程序</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
            padding: 10px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            background: linear-gradient(to right, #2c3e50, #4a6491);
            color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }
        
        .tab.active {
            background: #4a6491;
            color: white;
            border-bottom: 3px solid #ffcc00;
        }
        
        .tab:not(.active):hover {
            background: #f0f0f0;
        }
        
        .content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 抽取技能板块样式 */
        .draw-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #2c3e50;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
        }
        
        .section-title::before {
            content: "✦";
            margin-right: 8px;
            color: #4a6491;
        }
        
        .draw-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, #4a6491, #2c3e50);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(74, 100, 145, 0.3);
            margin-bottom: 20px;
        }
        
        .draw-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 8px rgba(74, 100, 145, 0.3);
        }
        
        .draw-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .draw-result {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .skill-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid #e9ecef;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .skill-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, #4a6491, #2c3e50);
        }
        
        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: #4a6491;
        }
        
        .skill-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        
        .skill-desc {
            font-size: 14px;
            color: #666;
        }
        
        .my-skills-title {
            font-size: 18px;
            margin: 25px 0 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
        }
        
        .my-skills-title::before {
            content: "★";
            margin-right: 8px;
            color: #ff9900;
        }
        
        .my-skills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .my-skill {
            background: linear-gradient(135deg, #e6f7ff 0%, #d1ecff 100%);
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #b3d9ff;
            position: relative;
            min-height: 70px;
        }
        
        .my-skill.empty {
            background: #f8f9fa;
            border: 2px dashed #ced4da;
            color: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            min-height: 70px;
        }
        
        .skill-index {
            position: absolute;
            top: 5px;
            left: 8px;
            background: #4a6491;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-title {
            font-size: 22px;
            margin-bottom: 15px;
            color: #2c3e50;
            text-align: center;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .modal-btn.obtain {
            background: linear-gradient(to right, #4CAF50, #2E7D32);
            color: white;
        }
        
        .modal-btn.replace {
            background: linear-gradient(to right, #2196F3, #0D47A1);
            color: white;
        }
        
        .modal-btn.cancel {
            background: #f0f0f0;
            color: #666;
        }
        
        .modal-btn:active {
            transform: scale(0.98);
        }
        
        .replace-options {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .replace-option {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        
        .replace-option:hover, .replace-option.selected {
            border-color: #2196F3;
            background: #e3f2fd;
        }
        
        /* 春秋笔板块样式 */
        .spring-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .spring-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, #d35400, #e67e22);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(211, 84, 0, 0.3);
            margin-bottom: 20px;
        }
        
        .spring-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 8px rgba(211, 84, 0, 0.3);
        }
        
        .spring-result {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .spring-word {
            display: inline-block;
            font-size: 80px;
            font-weight: bold;
            color: #d35400;
            margin: 20px 0;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        }
        
        .spring-sequence {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .sequence-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            border-left: 5px solid #d35400;
            font-size: 18px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }
        
        .sequence-char {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            background: #d35400;
            color: white;
            border-radius: 5px;
            margin-right: 10px;
            font-weight: bold;
        }
        
        .sequence-options {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .sequence-btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .sequence-btn.positive {
            background: linear-gradient(to right, #4CAF50, #2E7D32);
            color: white;
        }
        
        .sequence-btn.negative {
            background: linear-gradient(to right, #2196F3, #0D47A1);
            color: white;
        }
        
        .sequence-btn.back {
            background: #f0f0f0;
            color: #666;
            margin-top: 10px;
        }
        
        .sequence-btn:active {
            transform: scale(0.98);
        }
        
        .explanation {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            border-left: 5px solid #d35400;
        }
        
        .explanation h3 {
            color: #d35400;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .explanation-item {
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
        }
        
        .explanation-item::before {
            content: "•";
            color: #d35400;
            font-weight: bold;
            margin-right: 10px;
        }
        
        /* 重置按钮 */
        .reset-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: linear-gradient(to right, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
            z-index: 100;
        }
        
        .reset-btn:active {
            transform: translateX(-50%) scale(0.95);
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
        }
        
        /* 响应式调整 */
        @media (max-width: 480px) {
            .draw-result, .my-skills {
                grid-template-columns: 1fr;
            }
            
            .spring-word {
                font-size: 60px;
            }
            
            .sequence-item {
                font-size: 16px;
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .tab {
                font-size: 16px;
                padding: 12px 5px;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
        }
        
        /* 提示信息 */
        .hint {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .skill-count {
            display: inline-block;
            background: #4a6491;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>陈寿小程序</h1>
            <div class="subtitle">技能抽取 · 春秋笔法</div>
        </header>
        
        <div class="tab-container">
            <div class="tab active" data-tab="draw">抽取技能</div>
            <div class="tab" data-tab="spring">春秋笔</div>
        </div>
        
        <!-- 抽取技能板块 -->
        <div id="draw-section" class="content active">
            <div class="draw-section">
                <div class="section-title">
                    技能池 <span class="skill-count" id="pool-count">100</span>
                </div>
                <button id="draw-btn" class="draw-btn">点击抽取技能</button>
                
                <div class="hint">每次随机展示2个技能，点击技能选择获取</div>
                
                <div id="draw-result" class="draw-result">
                    <!-- 抽取结果将通过JS动态生成 -->
                </div>
                
                <div class="my-skills-title">
                    我的技能 <span class="skill-count" id="my-skills-count">0</span>
                </div>
                <div id="my-skills" class="my-skills">
                    <!-- 已获得技能将通过JS动态生成 -->
                </div>
            </div>
        </div>
        
        <!-- 春秋笔板块 -->
        <div id="spring-section" class="content">
            <div class="spring-section">
                <div class="section-title">春秋笔法</div>
                <button id="spring-btn" class="spring-btn">点击春秋笔</button>
                
                <div id="spring-result" class="spring-result" style="display: none;">
                    <div class="spring-word" id="spring-word"></div>
                    
                    <div id="sequence-options">
                        <div class="sequence-options">
                            <button class="sequence-btn positive" data-sequence="positive">正序</button>
                            <button class="sequence-btn negative" data-sequence="negative">逆序</button>
                        </div>
                    </div>
                    
                    <div id="sequence-result" class="spring-sequence" style="display: none;">
                        <!-- 序列结果将通过JS动态生成 -->
                        <button class="sequence-btn back" id="back-btn">返回选择</button>
                    </div>
                </div>
                
                <div class="explanation">
                    <h3>春秋笔法规则</h3>
                    <div class="explanation-item">起：失去一点体力</div>
                    <div class="explanation-item">承：摸已损失体力的牌</div>
                    <div class="explanation-item">转：回复一点体力</div>
                    <div class="explanation-item">合：弃已损失体力的手牌</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 技能选择弹窗 -->
    <div id="skill-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-skill-name"></div>
            <div id="modal-buttons" class="modal-buttons">
                <button class="modal-btn obtain" id="obtain-btn">获得</button>
                <button class="modal-btn replace" id="replace-btn">替换</button>
                <button class="modal-btn cancel" id="cancel-btn">取消</button>
            </div>
            <div id="replace-options" class="replace-options" style="display: none;"></div>
        </div>
    </div>
    
    <!-- 重置按钮 -->
    <button id="reset-btn" class="reset-btn">重置所有内容</button>

            "孔淑（累卵）", "ol谋许攸（迁附）", "手杀谋姜维（北伐）", "手杀张燕（飞径）", "ol鲍三娘（武娘）",
            "国际服童渊（朝凤）", "ol魔吕布（罡拳）", "阮瑀（妙弦）", "国际霍峻（伺怠）", "ol谋诸葛亮（智绝）",
            "战典韦（狂戟）", "蛇贾诩（帷幕）", "单福（蔽蒙）", "神黄月英（神机）", "慢吕蒙（空志）",
            "慢颜良文丑（怯亡）", "将谋陆逊（隽谋）", "宝sp孙坚（英毅）", "线下司马懿（佯固）", "风云曹操（谲兵）",
            "徐妏（赋绘）", "徐庶（隐姓）", "ol魔曹操（覆载）"
        ];
        
        // 春秋笔序列和对应规则
        const springWords = ["起", "承", "转", "合"];
        const springRules = {
            "起": "失去一点体力",
            "承": "摸已损失体力的牌",
            "转": "回复一点体力",
            "合": "弃已损失体力的手牌"
        };
        
        const positiveSequence = ["起", "承", "转", "合", "起"];
        const negativeSequence = ["合", "转", "承", "起", "合"];
        
        // 状态变量
        let availableSkills = [...skillPool];
        let mySkills = [];
        let currentDrawResults = [];
        let selectedSkill = null;
        let currentSpringWord = "";
        
        // DOM元素
        const drawSection = document.getElementById('draw-section');
        const springSection = document.getElementById('spring-section');
        const tabs = document.querySelectorAll('.tab');
        const drawBtn = document.getElementById('draw-btn');
        const drawResult = document.getElementById('draw-result');
        const mySkillsContainer = document.getElementById('my-skills');
        const skillModal = document.getElementById('skill-modal');
        const modalSkillName = document.getElementById('modal-skill-name');
        const obtainBtn = document.getElementById('obtain-btn');
        const replaceBtn = document.getElementById('replace-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const replaceOptions = document.getElementById('replace-options');
        const poolCount = document.getElementById('pool-count');
        const mySkillsCount = document.getElementById('my-skills-count');
        const springBtn = document.getElementById('spring-btn');
        const springResult = document.getElementById('spring-result');
        const springWordEl = document.getElementById('spring-word');
        const sequenceOptions = document.getElementById('sequence-options');
        const sequenceResult = document.getElementById('sequence-result');
        const backBtn = document.getElementById('back-btn');
        const resetBtn = document.getElementById('reset-btn');
        
        // 初始化
        function init() {
            updateSkillCounts();
            renderMySkills();
            
            // 标签切换
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    
                    // 更新标签状态
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // 显示对应内容
                    document.querySelectorAll('.content').forEach(content => {
                        content.classList.remove('active');
                    });
                    
                    if (tabId === 'draw') {
                        drawSection.classList.add('active');
                    } else {
                        springSection.classList.add('active');
                    }
                });
            });
            
            // 抽取技能按钮
            drawBtn.addEventListener('click', drawSkills);
            
            // 技能弹窗按钮
            obtainBtn.addEventListener('click', obtainSkill);
            replaceBtn.addEventListener('click', showReplaceOptions);
            cancelBtn.addEventListener('click', () => {
                skillModal.classList.remove('active');
                replaceOptions.style.display = 'none';
            });
            
            // 春秋笔按钮
            springBtn.addEventListener('click', startSpring);
            
            // 正序/逆序按钮
            document.querySelectorAll('.sequence-btn[data-sequence]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const sequenceType = this.getAttribute('data-sequence');
                    showSpringSequence(sequenceType);
                });
            });
            
            // 返回按钮
            backBtn.addEventListener('click', () => {
                sequenceOptions.style.display = 'block';
                sequenceResult.style.display = 'none';
                sequenceResult.innerHTML = '';
            });
            
            // 重置按钮
            resetBtn.addEventListener('click', resetAll);
        }
        
        // 更新技能计数
        function updateSkillCounts() {
            poolCount.textContent = availableSkills.length;
            mySkillsCount.textContent = mySkills.length;
            
            // 当技能已满时禁用抽取按钮
            drawBtn.disabled = mySkills.length >= 4 && availableSkills.length === 0;
        }
        
        // 渲染我的技能
        function renderMySkills() {
            mySkillsContainer.innerHTML = '';
            
            for (let i = 0; i < 4; i++) {
                const skillDiv = document.createElement('div');
                skillDiv.className = 'my-skill';
                
                if (mySkills[i]) {
                    // 防止出现undefined
                    const skillParts = mySkills[i].split('：');
                    const name = skillParts[0] || '';
                    const desc = skillParts[1] || '';
                    
                    skillDiv.innerHTML = `
                        <div class="skill-index">${i + 1}</div>
                        <div class="skill-name">${name}</div>
                        <div class="skill-desc">${desc}</div>
                    `;
                } else {
                    skillDiv.className = 'my-skill empty';
                    skillDiv.textContent = '空技能槽';
                }
                
                mySkillsContainer.appendChild(skillDiv);
            }
        }
        
        // 抽取技能
        function drawSkills() {
            // 清空之前的结果
            drawResult.innerHTML = '';
            currentDrawResults = [];
            
            // 如果可用技能不足2个，补充提示
            if (availableSkills.length < 2) {
                drawResult.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">技能池中技能不足，无法抽取</div>';
                return;
            }
            
            // 随机抽取2个技能
            const shuffled = [...availableSkills].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 2);
            currentDrawResults = selected;
            
            // 渲染抽取结果
            selected.forEach(skill => {
                // 防止出现undefined
                const skillParts = skill.split('：');
                const name = skillParts[0] || '';
                const desc = skillParts[1] || '';
                
                const skillCard = document.createElement('div');
                skillCard.className = 'skill-card';
                skillCard.innerHTML = `
                    <div class="skill-name">${name}</div>
                    <div class="skill-desc">${desc}</div>
                `;
                
                skillCard.addEventListener('click', () => {
                    selectedSkill = skill;
                    modalSkillName.textContent = skill;
                    skillModal.classList.add('active');
                    
                    // 总是显示获得和替换按钮
                    obtainBtn.style.display = 'block';
                    replaceBtn.style.display = 'block';
                    
                    // 隐藏替换选项
                    replaceOptions.style.display = 'none';
                });
                
                drawResult.appendChild(skillCard);
            });
        }
        
        // 获得技能
        function obtainSkill() {
            if (!selectedSkill) return;
            
            // 如果技能槽已满，提示替换
            if (mySkills.length >= 4) {
                alert('技能槽已满，请选择替换技能！');
                showReplaceOptions();
                return;
            }
            
            // 添加到我的技能
            mySkills.push(selectedSkill);
            
            // 从可用池中移除
            const index = availableSkills.indexOf(selectedSkill);
            if (index > -1) {
                availableSkills.splice(index, 1);
            }
            
            // 更新UI
            updateSkillCounts();
            renderMySkills();
            
            // 关闭弹窗
            skillModal.classList.remove('active');
            replaceOptions.style.display = 'none';
            
            // 清空抽取结果（因为技能已被获取）
            drawResult.innerHTML = '<div style="text-align: center; color: #4CAF50; padding: 20px;">技能已获取！可以继续抽取</div>';
        }
        
        // 显示替换选项
        function showReplaceOptions() {
            // 如果没有技能可替换，提示先获得技能
            if (mySkills.length === 0) {
                alert('还没有获得技能，请先获得技能！');
                obtainSkill();
                return;
            }
            
            replaceOptions.innerHTML = '';
            replaceOptions.style.display = 'block';
            
            // 显示当前所有技能作为替换选项
            mySkills.forEach((skill, index) => {
                // 防止出现undefined
                const skillParts = skill.split('：');
                const name = skillParts[0] || '';
                const desc = skillParts[1] || '';
                
                const option = document.createElement('div');
                option.className = 'replace-option';
                option.innerHTML = `
                    <div class="skill-name">${name}</div>
                    <div class="skill-desc">${desc}</div>
                `;
                
                option.addEventListener('click', () => {
                    // 移除选中状态
                    document.querySelectorAll('.replace-option').forEach(el => {
                        el.classList.remove('selected');
                    });
                    
                    // 添加选中状态
                    option.classList.add('selected');
                    
                    // 执行替换
                    replaceSkill(index);
                });
                
                replaceOptions.appendChild(option);
            });
        }
        
        // 替换技能
        function replaceSkill(index) {
            if (!selectedSkill || index < 0 || index >= mySkills.length) return;
            
            // 将被替换的技能放回池子
            availableSkills.push(mySkills[index]);
            
            // 替换技能
            mySkills[index] = selectedSkill;
            
            // 从可用池中移除新技能
            const skillIndex = availableSkills.indexOf(selectedSkill);
            if (skillIndex > -1) {
                availableSkills.splice(skillIndex, 1);
            }
            
            // 更新UI
            updateSkillCounts();
            renderMySkills();
            
            // 关闭弹窗
            skillModal.classList.remove('active');
            replaceOptions.style.display = 'none';
            
            // 清空抽取结果
            drawResult.innerHTML = '<div style="text-align: center; color: #2196F3; padding: 20px;">技能已替换！可以继续抽取</div>';
        }
        
        // 开始春秋笔
        function startSpring() {
            // 随机选择一个字
            const randomIndex = Math.floor(Math.random() * springWords.length);
            currentSpringWord = springWords[randomIndex];
            
            // 显示结果
            springResult.style.display = 'block';
            springWordEl.textContent = currentSpringWord;
            
            // 显示正序/逆序选项
            sequenceOptions.style.display = 'block';
            sequenceResult.style.display = 'none';
            sequenceResult.innerHTML = '';
        }
        
        // 显示春秋笔序列
        function showSpringSequence(sequenceType) {
            // 隐藏选项，显示结果
            sequenceOptions.style.display = 'none';
            sequenceResult.style.display = 'block';
            
            // 生成序列
            let sequence = [];
            let startIndex = springWords.indexOf(currentSpringWord);
            
            if (sequenceType === 'positive') {
                // 正序：当前字后面的3个字
                for (let i = 1; i <= 3; i++) {
                    const index = (startIndex + i) % 4;
                    sequence.push(springWords[index]);
                }
            } else {
                // 逆序：当前字前面的3个字（反向）
                for (let i = 1; i <= 3; i++) {
                    const index = (startIndex - i + 4) % 4;
                    sequence.push(springWords[index]);
                }
            }
            
            // 清空并显示结果区域
            sequenceResult.innerHTML = '';
            
            // 添加当前字对应的规则
            const currentItem = document.createElement('div');
            currentItem.className = 'sequence-item';
            currentItem.innerHTML = `
                <span class="sequence-char">${currentSpringWord}</span>
                ${springRules[currentSpringWord]}
            `;
            sequenceResult.appendChild(currentItem);
            
            // 添加序列对应的规则
            sequence.forEach(char => {
                const item = document.createElement('div');
                item.className = 'sequence-item';
                item.innerHTML = `
                    <span class="sequence-char">${char}</span>
                    ${springRules[char]}
                `;
                sequenceResult.appendChild(item);
            });
            
            // 添加返回按钮
            const backButton = document.createElement('button');
            backButton.className = 'sequence-btn back';
            backButton.textContent = '返回选择';
            backButton.addEventListener('click', () => {
                sequenceOptions.style.display = 'block';
                sequenceResult.style.display = 'none';
                sequenceResult.innerHTML = '';
            });
            sequenceResult.appendChild(backButton);
        }
        
        // 重置所有内容
        function resetAll() {
            if (confirm('确定要重置所有内容吗？这将清空已获得的技能和春秋笔结果。')) {
                // 重置技能池
                availableSkills = [...skillPool];
                mySkills = [];
                currentDrawResults = [];
                selectedSkill = null;
                
                // 重置春秋笔
                currentSpringWord = "";
                springResult.style.display = 'none';
                sequenceOptions.style.display = 'none';
                sequenceResult.style.display = 'none';
                sequenceResult.innerHTML = '';
                
                // 更新UI
                updateSkillCounts();
                renderMySkills();
                drawResult.innerHTML = '';
                
                // 如果当前在抽取技能标签，滚动到顶部
                if (drawSection.classList.contains('active')) {
                    window.scrollTo(0, 0);
                }
            }
        }
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
